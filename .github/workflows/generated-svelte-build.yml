name: Generated Svelte build

# For each {example .ddd × svelte design pack@version} cell, generate
# the SvelteKit project, `npm install`, `svelte-check
# --fail-on-warnings` it (the .svelte type gate) and `vite build` it
# (the compiler + adapter-static gate).  The svelte sibling of
# generated-react-build.yml — catches generator/pack drift invisible
# to the IR-level tests.
#
# Matrix policy: the svelte example set is small (five examples × two
# packs), so every event runs the full Cartesian — no PR slice needed
# yet.  The list MUST match `svelteBuildExamples` ×
# `sveltePacks` in test/e2e/generated-svelte-build.test.ts (pinned by
# the matrix-sync guard there).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'designs/**'
      - 'examples/**'
      - 'sveltekit/**'
      - 'stacks/**'
      - 'test/e2e/generated-svelte-build.test.ts'
      - 'test/e2e/fixtures/svelte-build/**'
      - 'web/src/examples/svelte-*.ddd'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/generated-svelte-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'designs/**'
      - 'examples/**'
      - 'sveltekit/**'
      - 'stacks/**'
      - 'test/e2e/generated-svelte-build.test.ts'
      - 'test/e2e/fixtures/svelte-build/**'
      - 'web/src/examples/svelte-*.ddd'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/generated-svelte-build.yml'
      # A change confined to a non-Svelte backend cannot alter the Svelte
      # bundle — skip this gate per-PR when only that code changed.  The
      # push:main trigger above keeps the broad `src/**` net post-merge.
      - '!src/generator/java/**'
      - '!src/generator/dotnet/**'
      - '!src/generator/python/**'
      - '!src/generator/elixir/**'
      - '!src/platform/java.ts'
      - '!src/platform/dotnet.ts'
      - '!src/platform/dotnet/**'
      - '!src/platform/python.ts'
      - '!src/platform/elixir.ts'
      - '!src/platform/hono/**'
      - '!src/platform/hono.ts'
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ['examples/svelte-shop.ddd', 'test/e2e/fixtures/svelte-build/auth-ui.ddd', 'web/src/examples/svelte-store-showcase.ddd', 'web/src/examples/svelte-file-upload.ddd', 'web/src/examples/svelte-data-grid.ddd']
        pack: ['shadcnSvelte@v1', 'flowbite@v1']
    timeout-minutes: 10
    name: ${{ matrix.example }} × ${{ matrix.pack }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Root install runs the `prepare` lifecycle which calls
      # `langium:generate` to produce src/language/generated/.
      - name: Install Loom toolchain
        run: npm ci

      - name: Build toolchain
        run: npm run build

      - name: Run svelte-build shard
        env:
          LOOM_SVELTE_BUILD_CASE: ${{ matrix.example }}:${{ matrix.pack }}
        run: npx vitest run test/e2e/generated-svelte-build.test.ts

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  The jobs above are a matrix
  # (or a fan-out), so their check names are dynamic and cannot be named as
  # a required status check; this job can.  A skipped need counts as OK — a
  # label-guarded or path-skipped job is a legitimate no-op.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  generated-svelte-build-passed:
    name: generated-svelte-build-passed
    # `!cancelled()`, not `always()`: when a newer push supersedes this run,
    # cancel-in-progress cancels the needed jobs — always() would then wake
    # this rollup later and convert the quiet supersession into a spurious
    # FAILURE check on the stale SHA (webhook noise for anyone babysitting
    # the PR). !cancelled() skips the rollup with the run; a LONE cancelled
    # need on a live run (a job timeout) still fails via the step below —
    # that is the "cancelled reads as not-failed" trap, kept closed. Same
    # pattern as test.yml's tests-passed.
    if: ${{ !cancelled() }}
    needs: [matrix]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
