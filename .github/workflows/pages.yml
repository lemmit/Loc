name: Deploy landing page + playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/pages.yml'
  # Per-PR promotion (docs/ci-gating.md): the `build` job runs on PRs touching
  # the same inputs as push:main, so a playground/docs build break is caught
  # before merge instead of on the post-merge deploy.  `deploy` never runs on
  # a PR — same split the merge queue relies on.
  pull_request:
    paths:
      - 'docs/**'
      - 'web/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  merge_group:
permissions:
  contents: read
  pages: write
  id-token: write

# main-push runs serialize on one fixed group (deploys must not interleave);
# PR and merge-group runs get per-ref groups so they neither queue behind a
# deploy nor collide with each other.  PR runs cancel-in-progress (only the
# latest push matters); deploy runs never cancel.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'pages-deploy' || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build the site + playground.  This is also the merge-queue GATE half: on a
  # `merge_group` event this job runs end to end (typecheck, DDL unit, Node
  # smoke, vite build) so a queue candidate that breaks the playground build is
  # caught before it lands — while the `deploy` job below is skipped, so the
  # candidate is never published.  The build/deploy split is required for that:
  # the `github-pages` environment is branch-restricted to the Pages source, so
  # a job carrying `environment:` would be rejected outright on a
  # `gh-readonly-queue/**` ref, before any step ran.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Root install runs the `prepare` lifecycle, which calls
      # `langium:generate` to produce src/language/generated/.  The
      # web/ project imports that path via the toolchain re-exports,
      # so it must exist before the playground build runs.
      - name: Install Loom toolchain (root)
        run: npm ci

      - name: Render landing page + docs
        run: node docs/build.mjs

      - name: Install playground deps
        working-directory: web
        run: npm ci

      - name: Typecheck playground
        working-directory: web
        run: npm run typecheck

      # Network-free unit guard for the runtime DDL synth — catches the
      # per-context-pgSchema regression class (system-mode backends
      # query schema-qualified tables) that the network-dependent
      # e2e/runtime.spec.ts self-skips when the npm registry is
      # unreachable.
      - name: Test runtime DDL synth
        working-directory: web
        run: npm run test:ddl

      - name: Smoke playground (Node-side end-to-end)
        working-directory: web
        run: npm run e2e:smoke

      # C1: download the curated stacks' tarballs into
      # web/public/npm-mirror/ so the deployed playground installs
      # same-origin (no registry.npmjs.org round-trips).  vite build
      # copies public/ into dist/.
      - name: Build npm mirror
        working-directory: web
        run: npm run build:npm-mirror

      # C2: prebuild each design pack's frontend vendor (react + UI
      # libs) into shipped ESM chunks + importmap so the per-session
      # esbuild-wasm bundle externalises the vendor and bundles only
      # the generated app.  vite build copies public/ into dist/.
      - name: Build design-pack vendor
        working-directory: web
        run: npm run build:vendor

      - name: Build playground
        working-directory: web
        run: npm run build

      - name: Stage playground under _site/playground
        run: |
          mkdir -p docs/_site/playground
          cp -r web/dist/. docs/_site/playground/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  # Publish half.  Never runs from the merge queue or a pull request — those
  # events run this workflow to gate the build, not to ship a candidate that
  # may still be dequeued (or a branch that may never merge).
  deploy:
    if: github.event_name != 'merge_group' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  `deploy` is deliberately skipped
  # on `merge_group` (skipped counts as OK here), so the queue gates the build
  # without publishing.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  pages-passed:
    name: pages-passed
    # `!cancelled()`, not `always()`: when a newer push supersedes this run,
    # cancel-in-progress cancels the needed jobs — always() would then wake
    # this rollup later and convert the quiet supersession into a spurious
    # FAILURE check on the stale SHA (webhook noise for anyone babysitting
    # the PR). !cancelled() skips the rollup with the run; a LONE cancelled
    # need on a live run (a job timeout) still fails via the step below —
    # that is the "cancelled reads as not-failed" trap, kept closed. Same
    # pattern as test.yml's tests-passed.
    if: ${{ !cancelled() }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
