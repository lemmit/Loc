name: Generated Feliz build

# Generate the Feliz (Fable/F#/Elmish) frontend from a .ddd, then prove the
# emitted F# compiles via `dotnet fable` and bundles via `vite build` — the
# analogue of generated-react-build.yml (which tscs the emitted TSX) — AND that
# the bundle actually RUNS: a `vite preview` + headless-Chromium smoke drives the
# MVU loop, routing, and the wire layer's Remote state (the runtime sibling the
# other frontends get from generated-{vue,svelte}-e2e.yml, folded in here to
# reuse the single slow `dotnet fable` step).  Catches generator drift that
# lowers cleanly to IR but emits non-compiling / non-running F# — invisible to
# the fast vitest suite.
#
# One cell (the full CRUD showcase, inline below); grows example-by-example as
# the procedural pack does.  The .ddd is embedded here (not under examples/) so
# the other example-globbing gates never pick up a feliz-only source.

on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/feliz/**'
      - 'src/generator/_walker/**'
      - 'src/platform/feliz.ts'
      - 'src/platform/metadata.ts'
      - 'src/platform/registry.ts'
      - 'test/e2e/fixtures/java-build/hosts-feliz.ddd'
      - 'test/e2e/fixtures/elixir-vanilla-build/vanilla-embed-feliz.ddd'
      - 'scripts/feliz-smoke.mjs'
      - 'scripts/feliz-table-smoke.mjs'
      - 'scripts/feliz-data-grid-smoke.mjs'
      - 'scripts/feliz-scaffold-smoke.mjs'
      - 'scripts/feliz-scaffold-paging-smoke.mjs'
      - 'scripts/feliz-authgate-smoke.mjs'
      - '.github/workflows/generated-feliz-build.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/feliz/**'
      - 'src/generator/_walker/**'
      - 'src/platform/feliz.ts'
      - 'src/platform/metadata.ts'
      - 'src/platform/registry.ts'
      - 'test/e2e/fixtures/java-build/hosts-feliz.ddd'
      - 'test/e2e/fixtures/elixir-vanilla-build/vanilla-embed-feliz.ddd'
      - 'scripts/feliz-smoke.mjs'
      - 'scripts/feliz-table-smoke.mjs'
      - 'scripts/feliz-data-grid-smoke.mjs'
      - 'scripts/feliz-scaffold-smoke.mjs'
      - 'scripts/feliz-scaffold-paging-smoke.mjs'
      - 'scripts/feliz-authgate-smoke.mjs'
      - '.github/workflows/generated-feliz-build.yml'
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feliz-build:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install + build the toolchain
        run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - name: Generate the Feliz showcase system
        run: |
          mkdir -p ci-feliz
          # Four-page routed app — exercises multi-page routing (Page union +
          # parseUrl + React.router + Router.navigate) ALONGSIDE the wire layer
          # (Thoth decoders + Cmd-based Api + the Remote/QueryView MVU
          # projection — BOTH list `.all` and byId detail reads), the MVU counter
          # (state + action → dispatch), and the pack primitives
          # (Heading/Badge/Text/Button/Divider/Card + For).  The ProductDetail
          # page covers byId-on-navigation: a `:id` route → a `Remote<T option>`
          # fired via `pageCmd` on entry, rendered through `View.remoteOne`, plus
          # a `DestroyForm` (delete) → a mutation Cmd + navigate-on-success and an
          # `OperationForm` (a custom `rename` op) → an id-qualified POST to
          # /{id}/rename.  The ProductNew page covers a `CreateForm` → Thoth
          # encoders + Elmish form state (inputs → Set Msgs) + a POST Cmd, with
          # TYPED inputs (a `type: number` price, a `bool` inStock checkbox, an
          # `enum Status` <select>, a foreign-key `Category id?` <select> populated
          # from an implicit `Category.all` read via `View.idOptions`, a value-object
          # `Contact` flattened into `contactEmail`/`contactPhone` inputs re-nested
          # in the encoder, a scalar-array `tags: string[]?` comma-separated input
          # split into a JSON array, an OPTIONAL `note` — empty → null, exempt) and
          # a `Validation`-gated submit the smoke drives (disabled → fill → enabled).
          cat > ci-feliz/showcase.ddd <<'DDD'
          system Storefront {
            api ShopApi from Catalog

            subdomain Catalog {
              context Cat {
                enum Status { active inactive archived }
                valueobject Contact { email: string?  phone: string? }
                aggregate Category with crudish {
                  name: string
                  derived display: string = name
                }
                repository Categories for Category { }
                error ProductUnavailable { sku: string }
                aggregate Product with crudish {
                  name:     string
                  price:    money
                  // M-T1.22 — the numeric surface `dotnet fable` had never
                  // compiled: a PLAIN `decimal` (a JSON *number* on the wire,
                  // unlike money's string) and a `long` (F# `int64`, decoded
                  // with `Decode.int64`).  Both reach the create form, so the
                  // encoders + the numeric form guard compile here too.
                  weight:   decimal
                  sold:     long
                  inStock:  bool
                  note:     string?
                  status:   Status
                  category: Category id?
                  contact:  Contact
                  tags:     string[]?
                  operation rename(newName: string) { name := newName }
                  // Union-returning instance op driving a `match await` async
                  // effect on the detail page (M-T6.15).
                  operation reserve(): Product or ProductUnavailable {
                    return ProductUnavailable { sku: name }
                  }
                }
                repository Products for Product { }
                // M-T1.3 Phase 1 — a query-time SINGLETON projection.  Unlike
                // every other read in this app it is id-less AND single-shaped,
                // so it fires from `init` yet renders through `View.remoteOne`;
                // the Fable compile below is what proves the emitted
                // `Remote<CatalogSizeRow option>` actually typechecks.
                criterion InStock of Product as p = p.inStock == true
                projection CatalogSize {
                  products: int
                  stockValue: money
                  from Product as p
                  where InStock
                  select products = count, stockValue = sum(p.price)
                }
                // M-T1.3 Phase 4 — a GROUPED projection: the LIST response
                // shape, one row per group.  It is here because the two shapes
                // compile to DIFFERENT F# (`Remote<Row list>` + `Decode.list` +
                // `View.remoteList`, against the singleton's `option` +
                // `Decode.map Some` + `remoteOne`), and the shape used to be
                // hard-coded to the singleton — which emitted a call to a
                // `View.remoteList` that was never defined.  Only a Fable
                // compile over BOTH shapes catches that.
                projection StockByStatus {
                  status: Status
                  items: int
                  stockValue: money
                  from Product as p
                  group by p.status
                  select status = p.status, items = count(), stockValue = sum(p.price)
                }
              }
            }

            storage db { type: postgres }
            resource catState { for: Cat, kind: state, use: db }

            ui WebApp {
              api Shop: ShopApi
              // Store persistence (`persist:` — M-T1.20).  All four lifetimes, so
              // `dotnet fable` actually compiles the `StorePersist` module: Web
              // Storage hydration + write-back (local / session, incl. the int /
              // bool / money / string[] codecs), the query-string mirror plus the
              // `popstate` Elmish subscription (url), and a `memory` store as the
              // untouched control.  The url store's only field defaults EMPTY, so
              // the mirror writes no query param and the smoke's path routing is
              // unaffected.
              store Draft persist: local {
                state {
                  note:  string = ""
                  seen:  int = 0
                  ok:    bool
                  price: money
                  tags:  string[]
                }
                action write(t: string) { note := t }
                action bump() { seen := seen + 1 }
              }
              store Prefs persist: session {
                state { mode: string = "dark" }
                action setMode(m: string) { mode := m }
              }
              store Filters persist: url {
                state { term: string = "" }
                action setTerm(q: string) { term := q }
              }
              store Cart {
                state { items: int = 0 }
                action add() { items := items + 1 }
              }
              // User (non-extern) components — emitted as F# props functions
              // spliced ahead of the page views (`feliz/component-emit.ts`).
              // Two shapes, because they compile differently: SCALAR props
              // (a `{| label: string; cents: int |}` record, read as re-bound
              // locals) and a WIRE-RECORD prop (`{| p: Product |}`), which only
              // typechecks if the emitted domain record and the call site's row
              // binding agree — exactly what `dotnet fable` is here to prove.
              component PriceTag(label: string, cents: int) {
                body: Stack {
                  Text { label },
                  Text { cents > 100 ? "premium" : "budget" },
                  Text { string(cents * 2) }
                }
              }
              component ProductLine(p: Product) {
                body: Card { p.name, Text { p.price } }
              }
              page Home {
                route: "/"
                state { count: int = 0 }
                // A PAGE-level `derived` — a pure function of `state`, hoisted as
                // an F# `let` above the body (the Elmish twin of React's
                // `useMemo`).  Before M-T1.20 the page walk got an EMPTY
                // `derivedNames`, so the body read below rendered as a
                // `(* ref: doubled *)` give-up comment and the value silently
                // vanished; `dotnet fable` cannot see that, only this smoke can.
                derived doubled: int = count * 2
                action inc() { count := count + 1 }
                body: Stack {
                  Heading { "Storefront", level: 1 },
                  Badge { "beta" },
                  Text { `Clicks: {count}` },
                  Text { `Doubled: {doubled}` },
                  // M-T1.22 — integer division WIDENS to decimal in Loom
                  // (`5 / 2` is `2.5`), but F#'s `int / int` truncates.  The
                  // walker's `exprIntDivWidened` seam converts both operands;
                  // only a Fable compile proves the emitted `decimal` division
                  // typechecks against the `string` coercion around it.
                  Text { `Share: {count / 4}` },
                  // Store reads — the persisted tiers' hydrated values.
                  Text { `Draft: {Draft.note}` },
                  Text { `Mode: {Prefs.mode}` },
                  Text { `Term: {Filters.term}` },
                  Text { `Items: {Cart.items}` },
                  Button { "+", onClick: inc },
                  Divider { },
                  PriceTag { label: "Deal of the day", cents: 250 },
                  Button { "Browse products", to: "/products" }
                }
              }
              page Products {
                route: "/products"
                body: Stack {
                  Heading { "Products", level: 1 },
                  QueryView {
                    of:      Shop.Product.all,
                    loading: Text { "Loading…" },
                    error:   Text { "Failed to load" },
                    empty:   Text { "No products yet." },
                    data:    rows => Stack {
                      For { each: rows, p => ProductLine { p: p } }
                    }
                  },
                  Button { "Add a product", to: "/products/new" },
                  Button { "See the table", to: "/products/table" },
                  Button { "Back home", to: "/" }
                }
              }
              // M-T1.1 — the sorted / paged / filtered `Table` on Feliz.  Its own
              // page (not folded into Products above) so the existing
              // no-backend assertions there stay untouched; the smoke stubs the
              // list response to drive the controls against real rows.
              page ProductTable {
                route: "/products/table"
                state { sortKey: string = ""  sortDir: string = "asc"  pageNum: int = 1  q: string = "" }
                body: Stack {
                  Heading { "Product table", level: 1 },
                  QueryView {
                    of:      Shop.Product.all,
                    loading: Text { "Loading…" },
                    error:   Text { "Failed to load" },
                    empty:   Text { "No products yet." },
                    data:    rows => Table(
                      Column("Name", p => p.name, sortable: true),
                      Column("Price", p => p.price, sortable: true),
                      rows: rows,
                      sortKey: sortKey, sortDir: sortDir,
                      page: pageNum, pageSize: 3,
                      filter: q,
                      testid: "product-table")
                  },
                  Button { "Back to products", to: "/products" }
                }
              }
              // M-T1.1 slice 10e — the TanStack-backed `DataGrid` on Feliz.  Its
              // own page so the existing pages' assertions stay untouched.  The
              // smoke stubs the list response, because a grid with no rows has
              // nothing to sort, filter, hide or select — and every one of those
              // is a RUNTIME behaviour the F# compiler cannot check.
              page ProductGrid {
                route: "/products/grid"
                state { selectedIds: string[] }
                body: Stack {
                  Heading { "Product grid", level: 1 },
                  // The sibling that justifies `selection:` existing at all —
                  // it reads the page `state` field the grid writes.
                  Text { `Selected: {selectedIds.length}` },
                  QueryView {
                    of:      Shop.Product.all,
                    loading: Text { "Loading…" },
                    error:   Text { "Failed to load" },
                    empty:   Text { "No products yet." },
                    data:    rows => DataGrid(
                      Column("Name", p => p.name, sortable: true, filterable: true),
                      Column("Status", p => p.status, sortable: true),
                      // No accessorKey — renders through the projected row's
                      // lazy markup thunk instead.
                      Column("Price", p => Money { p.price }),
                      rows: rows,
                      selection: selectedIds,
                      multiSort: true,
                      columnVisibility: true,
                      pageSize: 25,
                      testid: "product-grid")
                  },
                  Button { "Back to products", to: "/products" }
                }
              }
              // M-T1.3 Phase 1 — the projection read.  Its own page so the
              // backend-less smoke above keeps asserting exactly what it did:
              // this one never gets visited, and the value here is the Fable
              // compile — a projection read is FOUR coordinated emissions (row
              // record + decoder, nullary Api fn, Model field + Msg + init Cmd,
              // update arm) and any one of them being wrong is an F# type error.
              page Insights {
                route: "/insights"
                body: Stack {
                  Heading { "Insights", level: 1 },
                  QueryView {
                    of:      Shop.CatalogSize,
                    loading: Text { "Loading…" },
                    error:   Text { "Failed to load" },
                    empty:   Text { "No data." },
                    data:    t => Card { "Catalog",
                      Text { t.products },
                      Money { t.stockValue }
                    }
                  },
                  // M-T1.3 Phase 4 — `Chart` on Feliz: inline SVG through the
                  // `View.chart` helper, no charting library and no `.fsproj`
                  // dependency.  Both kinds render from the same helper, so
                  // compiling one compiles both branches; both are here anyway
                  // because the CALL SITES differ (`isBar`, and the series
                  // accessor's `float` coercion over int vs money).
                  Chart {
                    kind: "bar",
                    of:   Shop.StockByStatus,
                    x:    r => r.status,
                    y:    r => r.stockValue
                  },
                  Chart {
                    kind: "line",
                    of:   Shop.StockByStatus,
                    x:    r => r.status,
                    y:    r => r.items
                  },
                  Button { "Back home", to: "/" }
                }
              }
              page ProductNew {
                route: "/products/new"
                body: Stack {
                  Heading { "New product", level: 1 },
                  CreateForm { of: Product },
                  Button { "Cancel", to: "/products" }
                }
              }
              page ProductDetail {
                route: "/products/:id"
                state { reserveMsg: string = "idle" }
                // `match await` async effect (M-T6.15): the trigger carries the
                // route id, the result reduces the op's tagged union to page
                // state — the success arm binds the Product, the else handles
                // the non-success outcome (and, with no backend, the thrown/
                // non-2xx path the runtime smoke exercises → "unavailable").
                action reserveNow() {
                  match await Shop.Product.reserve() {
                    Product p => { reserveMsg := p.name }
                    else      => { reserveMsg := "unavailable" }
                  }
                }
                body: Stack {
                  Heading { "Product", level: 1 },
                  QueryView {
                    of:      Shop.Product.byId(id),
                    single:  true,
                    loading: Text { "Loading…" },
                    error:   Text { "Failed to load" },
                    empty:   Text { "Product not found." },
                    data:    p => Card { p.name,
                      Text { p.price }
                    }
                  },
                  Text { `Reserve: {reserveMsg}` },
                  Button { "Reserve", onClick: reserveNow },
                  OperationForm { of: Product, op: rename },
                  DestroyForm { of: Product },
                  Button { "Back to products", to: "/products" }
                }
              }
            }

            deployable api { platform: node contexts: [Cat] dataSources: [catState] serves: ShopApi port: 3000 }
            deployable web { platform: feliz targets: api ui: WebApp { Shop: api } port: 3005 }
          }
          DDD
          node bin/cli.js generate system ci-feliz/showcase.ddd -o ci-feliz/out
      - name: Locate the emitted Feliz project
        id: proj
        run: echo "dir=$(dirname "$(find ci-feliz/out -name App.fsproj | head -1)")" >> "$GITHUB_OUTPUT"
      - name: Fable compile (F# → JS)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          dotnet tool restore
          dotnet fable App.fsproj -o out --extension .js
      - name: Vite build the bundle
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          npm install
          npx vite build
      # Runtime e2e — the build gate above proves the bundle COMPILES; this
      # proves it RUNS.  Serve the static bundle with `vite preview` and drive it
      # in headless Chromium: the app mounts, the MVU counter dispatches, routing
      # navigates, the wire layer's Remote state settles (no backend → the
      # QueryView shows its error/empty branch, which itself proves the Cmd +
      # Thoth-decoder path executed), and the detail page's `match await` async
      # effect flips page state via the trigger→Cmd.OfAsync→result projection
      # (M-T6.15).  Pure client-side, so no db sidecar.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the bundle + run the runtime smoke
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          npx vite preview --port 4173 --strictPort &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          SMOKE_URL=http://localhost:4173/ node "$GITHUB_WORKSPACE/scripts/feliz-smoke.mjs"
          # M-T1.1 — the Table's sort / pager / filter, driven against stubbed
          # rows (`page.route`) so the controls have data to act on.  Same
          # preview server; kept a separate script because it needs that stub
          # while the smoke above deliberately runs backend-less.
          SMOKE_URL=http://localhost:4173/ node "$GITHUB_WORKSPACE/scripts/feliz-table-smoke.mjs"
          # M-T1.1 slice 10e — the DataGrid's multi-sort / per-column filter /
          # column visibility / selection round-trip, against stubbed rows.  The
          # `dotnet fable` + `vite build` steps above prove the grid COMPILES;
          # only this proves the `@tanstack/table-core` interop actually drives a
          # row model (a partial `state` throws inside `getHeaderGroups()` and
          # renders a blank region, which both build steps report as green).
          SMOKE_URL=http://localhost:4173/ node "$GITHUB_WORKSPACE/scripts/feliz-data-grid-smoke.mjs"

      # Scaffold parity — the hand-built showcase above exercises the MVU/wire
      # paths; this proves a `with scaffold(...)`-generated app (List/New/Detail/
      # Home built from Table/Toolbar/Breadcrumbs/Paper/IdLink/Alert/… primitives,
      # PLUS a WorkflowForm from `workflows:`) also compiles AND runs — e2e parity
      # with the JSX frontends' scaffold examples.  Wrapped in the AUTH GATE
      # (`user{}` + `auth: required`/`auth: ui`): the session probe resolves and
      # the gated app renders (preview's SPA fallback answers /auth/me).  Reuses
      # the same toolchain + Playwright install.
      - name: Generate the scaffold parity app
        run: |
          cat > ci-feliz/scaffold.ddd <<'DDD'
          system Storefront {
            user { id: string  role: string }
            api ShopApi from Catalog
            subdomain Catalog {
              context Cat {
                valueobject Tag { label: string  weight: int }
                aggregate Product with crudish {
                  name:  string
                  price: money
                  tags:  Tag[]
                  operation rename(newName: string) { name := newName }
                }
                repository Products for Product { }
                workflow restock transactional {
                  create(sku: string, qty: int) {
                    precondition qty > 0
                    let p = Product.create(name: sku, price: 0)
                  }
                }
              }
            }
            storage db { type: postgres }
            resource catState { for: Cat, kind: state, use: db }
            ui WebApp with scaffold(aggregates: [Product], workflows: [restock]) {
              api Shop: ShopApi
            }
            deployable api { platform: node contexts: [Cat] dataSources: [catState] serves: ShopApi port: 3000 auth: required }
            deployable web { platform: feliz targets: api ui: WebApp { Shop: api } port: 3005 auth: ui }
          }
          DDD
          node bin/cli.js generate system ci-feliz/scaffold.ddd -o ci-feliz/scaffold-out
      - name: Locate the scaffold project
        id: sproj
        run: echo "dir=$(dirname "$(find ci-feliz/scaffold-out -name App.fsproj | head -1)")" >> "$GITHUB_OUTPUT"
      - name: Fable compile + vite build + runtime smoke (scaffold)
        working-directory: ${{ steps.sproj.outputs.dir }}
        run: |
          dotnet tool restore
          dotnet fable App.fsproj -o out --extension .js
          npm install
          npx vite build
          npx vite preview --port 4175 --strictPort &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4175/ >/dev/null && break
            sleep 1
          done
          SMOKE_URL=http://localhost:4175/ node "$GITHUB_WORKSPACE/scripts/feliz-scaffold-smoke.mjs"
          # M-T2.6 Feliz leg — the scaffolded list is SERVER-paged, so this
          # asserts the query strings it actually sends on Prev/Next and on a
          # header click.  A pager that renders and a pager that pages look
          # identical in the DOM against a stub; only the request tells them
          # apart.
          SMOKE_URL=http://localhost:4175/ node "$GITHUB_WORKSPACE/scripts/feliz-scaffold-paging-smoke.mjs"

      # Third leg: the UI AUTHORIZATION GATE (D-AUTH-OIDC).  A page carrying
      # `requires currentUser.role == "admin"` decodes the verified session
      # claims (`/api/auth/me` → a typed `CurrentUser` record via Thoth) and
      # wraps the gated view in a `Some currentUser when <gate> -> … | _ ->
      # forbiddenView` guard — the client mirror of the backend 403.  The smoke
      # STUBS `/api/auth/me` (Playwright request interception) so BOTH branches
      # run for real: admin claims → the gated body renders; viewer claims →
      # forbiddenView.  (The scaffold leg above stays gate-free, so it keeps its
      # SPA-fallback probe; the claims decode needs a JSON body, hence the stub.)
      - name: Generate the auth-gate app
        run: |
          cat > ci-feliz/authgate.ddd <<'DDD'
          system GateShop {
            user { id: string  role: string }
            api ShopApi from Catalog
            subdomain Catalog {
              context Cat {
                aggregate Product {
                  name:   string
                  price:  money
                  active: bool
                  operation activate() { requires currentUser.role == "admin"  active := true }
                }
                repository Products for Product { }
              }
            }
            storage db { type: postgres }
            resource catState { for: Cat, kind: state, use: db }
            ui WebApp {
              api Shop: ShopApi
              page Home { route: "/"  body: Heading { "Welcome", level: 1 } }
              page Admin {
                route: "/admin"
                requires currentUser.role == "admin"
                body: Heading { "Admin Console", level: 1 }
              }
              // A gated ONE-CLICK action: the byId detail hosts Action { p.activate },
              // whose op requires currentUser.role == "admin" — a native F# dispatch
              // (POST /{id}/activate) hidden from non-admins via the decoded claims.
              // Proves the Action primitive + action-button gating.
              page ProductDetail {
                route: "/products/:id"
                body: QueryView {
                  of: Shop.Product.byId(id), single: true,
                  loading: Text { "Loading…" }, error: Text { "err" }, empty: Text { "none" },
                  data: p => Stack {
                    Heading { p.name, level: 1 },
                    Action { p.activate }
                  }
                }
              }
            }
            deployable api { platform: node contexts: [Cat] dataSources: [catState] serves: ShopApi port: 3000 auth: required }
            deployable web { platform: feliz targets: api ui: WebApp { Shop: api } port: 3005 auth: ui }
          }
          DDD
          node bin/cli.js generate system ci-feliz/authgate.ddd -o ci-feliz/authgate-out
      - name: Locate the auth-gate project
        id: gproj
        run: echo "dir=$(dirname "$(find ci-feliz/authgate-out -name App.fsproj | head -1)")" >> "$GITHUB_OUTPUT"
      - name: Fable compile + vite build + runtime smoke (auth gate)
        working-directory: ${{ steps.gproj.outputs.dir }}
        run: |
          dotnet tool restore
          dotnet fable App.fsproj -o out --extension .js
          npm install
          npx vite build
          npx vite preview --port 4176 --strictPort &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4176/ >/dev/null && break
            sleep 1
          done
          SMOKE_URL=http://localhost:4176/ node "$GITHUB_WORKSPACE/scripts/feliz-authgate-smoke.mjs"

      # Backend-embed case: a `platform: java` backend hosting a
      # `framework: feliz` ui relocates the whole Feliz project under
      # `ClientApp/` (pathPrefix).  Fable+vite-build that relocated project to
      # prove the embed emits a compilable bundle (the per-backend build gates
      # compile only the BACKEND, never the embedded SPA — this is the one
      # place the embedded Feliz F# actually compiles).  Same `dotnet fable`
      # toolchain already set up above, so the marginal cost is one compile.
      - name: Generate the fullstack-embed (java hosts feliz) system
        run: |
          node bin/cli.js generate system \
            test/e2e/fixtures/java-build/hosts-feliz.ddd -o ci-feliz/embed-out
      - name: Locate the embedded Feliz project (ClientApp/)
        id: eproj
        run: echo "dir=$(dirname "$(find ci-feliz/embed-out -path '*ClientApp*' -name App.fsproj | head -1)")" >> "$GITHUB_OUTPUT"
      - name: Fable compile + vite build (embedded feliz)
        working-directory: ${{ steps.eproj.outputs.dir }}
        run: |
          dotnet tool restore
          dotnet fable App.fsproj -o out --extension .js
          npm install
          npx vite build
