name: Generated Angular build

# For each {case × angular pack} cell, generate the Angular project,
# `npm install`, and `ng build` it (the Angular CLI typechecks + bundles
# in one step).  The Angular analogue of generated-vue-build.yml — catches
# generator/pack drift invisible to the IR-level tests, institutionalising
# the per-PR `ng build` verification from the Slice-4 batches.
#
# Matrix policy:
#   - pull_request    → showcase (read + create-form + byId + action surface),
#                       store (shared signal-store surface) and grid × the
#                       packs.  `grid` is in the PR slice because the
#                       DataGrid's markup lands in a HOISTED SIBLING component
#                       whose template — strictTemplates-checked, and resolving
#                       every name against the CLASS — no other case reaches.
#   - push: main /    → full sweep
#     workflow_dispatch  ({minimal, scaffold, showcase, store, file, grid,
#                        history}).
#   - ALWAYS (both)   → `history × angularMaterial@v1`, added through
#                       `include:` rather than by widening CASES, so it costs
#                       ONE cell instead of one-per-pack.  See the `include`
#                       block below for why one Angular cell is the whole gate.
#
# Cell names MUST match the case labels in
# test/e2e/generated-angular-build.test.ts (`<case>:<pack>`).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'designs/angularMaterial/**'
      - 'api/**'
      - 'docker/**'
      - 'stacks/ng1/**'
      - 'test/e2e/generated-angular-build.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/generated-angular-build.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'src/**'
      - 'designs/angularMaterial/**'
      - 'api/**'
      - 'docker/**'
      - 'stacks/ng1/**'
      - 'test/e2e/generated-angular-build.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/generated-angular-build.yml'
      # A change confined to a non-Angular backend cannot alter the Angular
      # bundle — skip this gate per-PR when only that code changed.  The
      # push:main trigger above keeps the broad `src/**` net post-merge.
      - '!src/generator/java/**'
      - '!src/generator/dotnet/**'
      - '!src/generator/python/**'
      - '!src/generator/elixir/**'
      - '!src/platform/java.ts'
      - '!src/platform/dotnet.ts'
      - '!src/platform/dotnet/**'
      - '!src/platform/python.ts'
      - '!src/platform/elixir.ts'
      - '!src/platform/hono/**'
      - '!src/platform/hono.ts'
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Slim PR slice: the two most representative cases (feature
            # showcase + the shared signal-store surface) × two
            # representative packs (Material + PrimeNG).  spartanNg, the
            # `minimal`/`scaffold`/`file` cases, and full pack drift are
            # caught by the push:main sweep below one merge later.
            CASES='["showcase","store","grid"]'
            PACKS='["angularMaterial@v1", "primeng@v1"]'
          else
            CASES='["minimal","scaffold","showcase","store","file","grid"]'
            PACKS='["angularMaterial@v1", "primeng@v1", "spartanNg@v1"]'
          fi
          # `history` (an `audited` aggregate + a scaffolded ui → the
          # scaffolded History section) rides in through `include:`, NOT by
          # being added to CASES.  A CASES entry is multiplied by every pack —
          # 2 cells per PR, 3 post-merge.  An include entry whose keys collide
          # with the matrix dimensions cannot be folded into an existing
          # combination, so GitHub appends it as exactly ONE new cell.
          #
          # One cell is the whole gate, and one FRONTEND is too:  the section's
          # payload is a template over an `AuditEntry[]` typed `unknown` at the
          # leaves, and `ng build` is the only per-PR gate that runs
          # `strictTemplates` over generated markup.  The defect this exists to
          # catch — a double `?? []` guard, TS2869 — fails here.  The pack is
          # irrelevant to it (`Timeline` emits native `<ol>`/`<li>`/`<dl>`, no
          # pack components), hence one pack, the default.
          echo "matrix={\"case\":$CASES,\"pack\":$PACKS,\"include\":[{\"case\":\"history\",\"pack\":\"angularMaterial@v1\"}]}" >> "$GITHUB_OUTPUT"

  matrix:
    needs: configure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    timeout-minutes: 12
    name: ${{ matrix.case }} × ${{ matrix.pack }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      - name: Install Loom toolchain
        run: npm ci

      - name: Build toolchain
        run: npm run build

      - name: Run angular-build shard
        env:
          LOOM_ANGULAR_BUILD_CASE: ${{ matrix.case }}:${{ matrix.pack }}
        run: npx vitest run test/e2e/generated-angular-build.test.ts

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  The jobs above are a matrix
  # (or a fan-out), so their check names are dynamic and cannot be named as
  # a required status check; this job can.  A skipped need counts as OK — a
  # label-guarded or path-skipped job is a legitimate no-op.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  generated-angular-build-passed:
    name: generated-angular-build-passed
    # `!cancelled()`, not `always()`: when a newer push supersedes this run,
    # cancel-in-progress cancels the needed jobs — always() would then wake
    # this rollup later and convert the quiet supersession into a spurious
    # FAILURE check on the stale SHA (webhook noise for anyone babysitting
    # the PR). !cancelled() skips the rollup with the run; a LONE cancelled
    # need on a live run (a job timeout) still fails via the step below —
    # that is the "cancelled reads as not-failed" trap, kept closed. Same
    # pattern as test.yml's tests-passed.
    if: ${{ !cancelled() }}
    needs: [configure, matrix]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
