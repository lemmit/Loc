name: main-red alarm

# The missing signal. dapper sat red on 100% of main pushes and nobody
# noticed — because it was *never* green, there was no red-transition to
# alert on. This closes that gap: whenever a monitored gate concludes
# `failure` on `main`, open (or update) a single tracking issue so a broken
# gate is visible instead of silently rotting.
#
# `workflow_run` fires after the monitored workflow completes, on the default
# branch, with the repo's own token — no external secret, no Slack webhook.
#
# THE LIST BELOW IS EVERY WORKFLOW THAT RUNS ON `push: main`, and that is the
# whole rule: if a gate runs on main, its failure alarms. A hand-curated
# subset is what let `api-call-e2e` sit red on 100% of its main pushes for two
# days — it was never watched, so nothing said so. `workflows:` takes literal
# names (no expressions), so the list is spelled out here and
# `test/system/main-red-alarm-coverage.test.ts` fails the fast suite the
# moment it drifts from the workflow directory. Adding a main gate therefore
# means adding its name here; the test tells you so.
#
# Noise is bounded by design: every failure lands as a comment on the ONE
# issue labelled `ci-red`, not as a new issue per gate.

on:
  workflow_run:
    workflows:
      - ".NET OIDC auth (runtime e2e)"
      - ".NET build verification"
      - ".NET observability events (runtime e2e)"
      - "API call (typed in-system call runtime e2e)"
      - "Behavioral UI e2e (headless, no docker)"
      - "Behavioral e2e (headless, no docker)"
      - "Behavioral e2e — .NET (ASP.NET + EF Core)"
      - "Behavioral e2e — .NET (persistence: dapper)"
      - "Behavioral e2e — Elixir (plain Ecto/Phoenix)"
      - "Behavioral e2e — Java (Spring Boot + JPA)"
      - "Behavioral e2e — Python (FastAPI)"
      - "Behavioral e2e — node/Hono (MikroORM)"
      - "Channels (broker runtime e2e)"
      - "Conformance parity (per-PR)"
      - "Context integration (runtime e2e)"
      - "Corpus compile gate (Elixir)"
      - "Corpus compile gates"
      - "Deploy landing page + playground to GitHub Pages"
      - "Elixir / Vanilla VO wire round-trip (runtime e2e)"
      - "Elixir / Vanilla build verification"
      - "Elixir / Vanilla runtime e2e (observability)"
      - "Generated Angular build"
      - "Generated Angular e2e"
      - "Generated Feliz build"
      - "Generated Flutter build"
      - "Generated React TSX build"
      - "Generated React e2e"
      - "Generated Svelte build"
      - "Generated Svelte e2e"
      - "Generated Vue build"
      - "Generated Vue e2e"
      - "Hono OIDC auth (runtime e2e)"
      - "Hono observability events (runtime e2e)"
      - "Java OIDC auth (runtime e2e)"
      - "Java build verification"
      - "Java observability e2e"
      - "Kubernetes/Helm validation"
      - "Langium generated files in sync"
      - "Lint GitHub Actions workflows"
      - "Mailer smtp (runtime e2e)"
      - "Migration evolution (runtime e2e)"
      - "OIDC auth (full-compose runtime e2e)"
      - "OIDC auth — Elixir/Phoenix (full-compose runtime e2e)"
      - "Phoenix / LiveView UI smoke (runtime e2e)"
      - "Playground e2e"
      - "Playground worker-realm check"
      - "Python OIDC auth (runtime e2e)"
      - "Python build verification"
      - "Python observability e2e"
      - "Schema load (emitted DDL)"
      - "Tenancy isolation (runtime e2e)"
      - "Tests + coverage"
      - "TypeScript (Hono) build verification"
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  alarm:
    # Only real failures on the default branch. Skip success, cancelled
    # (concurrency-superseded), and non-main runs.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const line = `- **${run.name}** failed on \`${run.head_sha.slice(0,8)}\` — [run](${run.html_url})`;

            // Dedup by the `ci-red` label (reliably indexed, unlike body text).
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-red', per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body: line,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: '🔴 main is red',
                body: `A gate failed on \`main\`. Fix or revert, then close this issue.\n\n${line}`,
                labels: ['ci-red'],
              });
            }

  # The recovery half.  Without it the alarm can only ever say "red": #2469 sat
  # open for a week carrying 16 comments while main had been green for three
  # days, and a permanently-open issue stops being read as a signal.
  #
  # It also makes RED TIME measurable.  `quality-delta` has a "main-push gate
  # failures" section that can count failures but cannot say how long main was
  # broken, because nothing records the green transition.  Closing the issue
  # with its own open→close span is that record.
  #
  # The close is CONSERVATIVE: one workflow going green says nothing about the
  # others, so this closes only when the latest run of EVERY workflow that has
  # run on main is non-failing.  A gate that went red and has not run since is
  # still red, and correctly holds the issue open.
  recovered:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-red', per_page: 1,
            });
            if (!open.length) return;                       // nothing to close
            const issue = open[0];

            // Latest completed run per workflow on main, any event: a nightly
            // schedule failure alarms the same as a push failure, so recovery
            // has to clear it too.
            const latest = new Map();
            for (let page = 1; page <= 5; page += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, branch: 'main', status: 'completed',
                per_page: 100, page,
              });
              for (const run of data.workflow_runs) {
                // The API returns newest first, so the first sighting wins.
                if (!latest.has(run.workflow_id)) latest.set(run.workflow_id, run);
              }
              if (data.workflow_runs.length < 100) break;
            }

            const stillRed = [...latest.values()].filter((r) => r.conclusion === 'failure');
            if (stillRed.length) {
              core.info(`Holding open — ${stillRed.length} workflow(s) still red: ` +
                stillRed.map((r) => r.name).join(', '));
              return;
            }

            const openedAt = new Date(issue.created_at);
            const hours = Math.round((Date.now() - openedAt.getTime()) / 36e5);
            const span = hours >= 48 ? `${Math.round(hours / 24)}d` : `${hours}h`;
            const run = context.payload.workflow_run;

            await github.rest.issues.createComment({
              ...context.repo, issue_number: issue.number,
              body: `✅ **main is green** — every workflow's latest run on \`main\` is passing ` +
                `(confirmed after **${run.name}** on \`${run.head_sha.slice(0, 8)}\`, ` +
                `[run](${run.html_url})).\n\n` +
                `Red for **${span}** (opened ${issue.created_at}, ${latest.size} workflows checked).`,
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: issue.number,
              state: 'closed', state_reason: 'completed',
            });
