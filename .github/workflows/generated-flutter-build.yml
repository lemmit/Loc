name: Generated Flutter build

# Generate the Flutter (Dart/Material) mobile frontend from a .ddd, then prove
# the emitted Dart actually COMPILES: `flutter analyze` (errors) + `flutter build
# web`.  The analogue of generated-feliz-build.yml (which Fable-compiles the
# emitted F#) — Flutter is structurally a Feliz clone (a non-JSX WalkerTarget
# riding the shared walkBody engine), so this gate catches generator drift that
# lowers cleanly to IR but emits non-compiling Dart — invisible to the fast
# vitest suite (which only asserts emitted-string shape; no local Flutter SDK).
#
# Covers the full shipped interactive surface — display + Riverpod state/actions
# + data reads (QueryView) + workflows + match-await + forms
# (Create/Operation/Workflow/Destroy) + Modal + the pack inputs (Field /
# MultilineField / PasswordField / NumberField / Toggle / SelectField /
# FileUpload) + Tabs + named routing.  Only the native (non-web) surface remains
# deferred.  `analyze` runs errors-only
# (`--no-fatal-warnings --no-fatal-infos`) so lint-nits (prefer_const infos)
# don't block; `flutter build web` is the load-bearing "is the Dart real"
# check.  The .ddd is embedded here (not under examples/) so the other
# example-globbing gates never pick up a flutter-only source.

on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/flutter/**'
      - 'src/generator/_walker/**'
      - 'src/generator/_packs/required-primitives.ts'
      - 'src/platform/flutter.ts'
      - 'src/platform/metadata.ts'
      - 'src/platform/registry.ts'
      - 'scripts/flutter-table-controls-test.dart'
      - '.github/workflows/generated-flutter-build.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/flutter/**'
      - 'src/generator/_walker/**'
      - 'src/generator/_packs/required-primitives.ts'
      - 'src/platform/flutter.ts'
      - 'src/platform/metadata.ts'
      - 'src/platform/registry.ts'
      - 'scripts/flutter-table-controls-test.dart'
      - '.github/workflows/generated-flutter-build.yml'
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-build:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install + build the toolchain
        run: npm ci
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate the Flutter showcase system
        run: |
          mkdir -p ci-flutter
          # Full interactive showcase — exercises every shipped tier:
          #   • Riverpod state + actions (Home's counter: state{count} + inc())
          #   • a stateless user component (Home's Tagline(text:) → a StatelessWidget)
          #   • a stateful user component (Home's MiniCounter(start:): state{count} +
          #     inc()/addN() → a StatefulWidget holding an immutable Model)
          #   • match await async effect (RestockProduct: await a Result-returning
          #     op → reify error variant → Dart-3 switch → state write)
          #   • data reads (Products' QueryView over Shop.Product.all + For + Card)
          #   • money end-to-end (M-T1.21): a `money` primitive field + optional,
          #     a money operation arg, a money projection column charted as a
          #     series, a money page-state cell with a literal, an addition, a
          #     `Money { }` display and a `round(2)` intrinsic
          #   • forms (NewProduct's CreateForm; NewCategory's WorkflowForm;
          #     ProductAdmin's OperationForm + Modal-wrapped op-form dialog +
          #     DestroyForm on a :id route) over every field kind (string/int/bool/
          #     enum/datetime/optional + a Money value object + a Category id
          #     FK-loaded dropdown + a tags string[] add/remove row list + a
          #     lines LineItem[] repeatable VO sub-form)
          #   • display + multi-page named routing + navigation buttons
          # This is the load-bearing "does the emitted Dart compile" gate.
          cat > ci-flutter/showcase.ddd <<'DDD'
          system Storefront {
            api ShopApi from Catalog
            subdomain Catalog {
              context Cat {
                enum Status { active inactive archived }
                valueobject Money { amount: int  currency: string }
                valueobject LineItem { sku: string  qty: int }
                aggregate Category {
                  name: string
                  derived display: string = name
                }
                workflow addCategory transactional {
                  create(label: string) { let c = Category.create({ name: label }) }
                }
                error OutOfStock { detail: string }
                aggregate Product {
                  name: string  price: int  inStock: bool  status: Status  note: string?  cost: Money
                  // The `money` PRIMITIVE (M-T1.21).  Until this landed, the
                  // whole class was unwitnessed here: `price` is an `int` and
                  // `cost` is a hand-rolled VALUE OBJECT, so no gate ever put a
                  // money primitive through the Flutter emitter — which is
                  // exactly how a decode that threw on every money read stayed
                  // green.  Money is a Dart `String` (the wire's own digits)
                  // with a `LoomMoney` runtime behind its arithmetic, so this
                  // pair now compiles the model field, the CreateForm input,
                  // the operation-form input, the projection column, the chart
                  // series, the `Money { }` display and the intrinsics below.
                  unitPrice: money  discount: money?
                  category: Category id  tags: string[]  lines: LineItem[]
                  // File as an AGGREGATE FIELD (not just page state).  `File`
                  // already spells the NULLABLE `FileRef?` in Dart, so the model
                  // emitter used to double the marker (`final FileRef?? spec;`,
                  // `FileRef?? manual` in copyWith) and call `.toJson()` on a
                  // nullable receiver — Dart that does not parse.  Both
                  // optionalities are here because they took DIFFERENT wrong
                  // turns.  The in-FORM half rides along: NewProduct's
                  // CreateForm now hosts two `file` inputs (pick -> multipart
                  // POST /files -> FileRef), which `flutter analyze` is what
                  // proves compiles.  The old fixture had File only in page
                  // state, so this whole class was unguarded.
                  manual: File  spec: File?
                  operation rename(newName: string) { name := newName }
                  operation reprice(newPrice: money) { unitPrice := newPrice }
                  operation restock(): Product or OutOfStock { inStock := true }
                }
                repository Categories for Category { }
                repository Products for Product {
                  find byName(term: string): Product[] where this.name == term
                  // PARAMETERLESS find — the branch that shipped invalid Dart
                  // (#2433).  A named find's provider is keyed by a RECORD of
                  // its params, and with none that spelled the empty record as
                  // `({})` instead of `()`, so `reads.dart` did not parse at
                  // all.  Every other Flutter-reachable read in this fixture
                  // takes an argument, which is exactly why the gate stayed
                  // green through it.
                  find inStock(): Product[] where this.inStock == true
                }
                // M-T1.3 Phase 1 — query-time PROJECTION reads, both shapes:
                // a SINGLETON (one object, `FutureProvider<Row?>`) and a
                // GROUPED one (one row per group, `FutureProvider<List<Row>>`).
                // Both are id-less and paramless, so neither is a `.family` —
                // and `flutter analyze` is what proves the emitted Dart types
                // line up, which no assertion on emitted text can.
                criterion InStock of Product as p = p.inStock == true
                projection CatalogSize {
                  products: int
                  stockValue: int
                  from Product as p
                  where InStock
                  select products = count, stockValue = sum(p.price)
                }
                projection ProductsByStatus {
                  status: Status
                  n: int
                  from Product as p
                  group by p.status
                  select status = p.status, n = count
                }
                // A MONEY projection column, charted below: the chart's series
                // coercion has to be total over the wire string, which an
                // `as num` cast is not.
                projection RevenueByStatus {
                  status: Status
                  revenue: money
                  from Product as p
                  group by p.status
                  select status = p.status, revenue = sum(p.unitPrice)
                }
              }
            }
            storage db { type: postgres }
            storage files { type: localDisk }
            resource catState { for: Cat, kind: state, use: db }
            resource catFiles { for: Cat, kind: objectStore, use: files }
            ui MobileApp {
              framework: flutter
              api Shop: ShopApi
              component Tagline(text: string) { body: Card { Text { text } } }
              component MiniCounter(start: int) {
                state { count: int = start }
                action inc() { count := count + 1 }
                action addN(n: int) { count := count + n }
                body: Card { Stack {
                  Text { `MiniCounter: {count}` },
                  Button { "step", onClick: inc }
                } }
              }
              page Home {
                route: "/"
                // `budget` is a money-typed STATE cell seeded from a bare
                // decimal literal — the spelling that used to emit a `double`
                // into a `String` field.  `raise()` adds a money LITERAL to it
                // (string concatenation if the operator seam is missing), and
                // the display + intrinsic below read it back.
                state { count: int = 0  budget: money = 12.5 }
                action inc() { count := count + 1 }
                action raise() { budget := budget + money("2.50") }
                body: Stack {
                  Heading { "Storefront", level: 1 },
                  Tagline(text: "Shop smarter"),
                  MiniCounter(start: 10),
                  Text { `Taps: {count}` },
                  Money { budget },
                  Money { budget, currency: "USD", decimals: 2 },
                  Text { budget.round(2) },
                  Button { "+", onClick: inc },
                  Button { "Raise budget", onClick: raise },
                  Button { "Browse products", to: "/products" }
                }
              }
              page Products {
                route: "/products"
                body: Stack {
                  Heading { "Products", level: 1 },
                  QueryView {
                    of: Shop.Product.all,
                    loading: Text { "Loading…" }, error: Text { "Failed" }, empty: Text { "No products yet." },
                    data: rows => Stack { For { each: rows, p => Card { p.name, Text { p.price } } } }
                  },
                  QueryView {
                    of: Shop.Product.byName("widget"),
                    loading: Text { "Loading…" }, error: Text { "Failed" }, empty: Text { "No matches." },
                    data: hits => Stack { For { each: hits, h => Text { h.name } } }
                  },
                  QueryView {
                    of: Shop.Product.inStock,
                    loading: Text { "Loading…" }, error: Text { "Failed" }, empty: Text { "None in stock." },
                    data: avail => Stack { For { each: avail, a => Text { a.name } } }
                  },
                  Button { "Add product", to: "/products/new" }
                }
              }
              // EVERY page primitive renders on Flutter: the controlled inputs
              // (Field / MultilineField / PasswordField / NumberField / Toggle /
              // SelectField) + FileUpload via the flutter pack, Tabs as a
              // container, and Forms (Create/Operation/Workflow/Destroy) + Modal
              // via the flutterTarget walker SEAMS.  The Preferences page below
              // exercises the pack inputs + Tabs + FileUpload in one place.
              page NewProduct { route: "/products/new"  body: Stack { Heading { "New", level: 1 }, CreateForm { of: Product } } }
              page Preferences {
                route: "/preferences"
                state { notify: bool = false  displayName: string = ""  about: string = ""  secret: string = ""  themePref: string = "system"  perPage: int = 20  avatar: File }
                body: Stack {
                  Heading { "Preferences", level: 1 },
                  Tabs {
                    Tab { "Profile", Stack {
                      Field { "Display name", bind: displayName },
                      MultilineField { "About", bind: about },
                      PasswordField { "Secret", bind: secret },
                      FileUpload { "Avatar", bind: avatar }
                    } },
                    Tab { "Settings", Stack {
                      Toggle { "Notifications", bind: notify },
                      SelectField { "Theme", bind: themePref, options: ["system", "light", "dark"] },
                      NumberField { "Rows per page", bind: perPage }
                    } }
                  }
                }
              }
              page RestockProduct {
                route: "/products/:id/restock"
                state { note: string = "" }
                action restock() {
                  match await Shop.Product.restock() {
                    Product p    => { note := p.name }
                    OutOfStock e => { note := e.detail }
                  }
                }
                body: Stack { Heading { "Restock", level: 1 }, Text { note }, Button { "Restock", onClick: restock } }
              }
              // M-T1.3 Phase 1 — the projection reads.  Their own page so the
              // existing pages' assertions stay untouched.
              page Insights {
                route: "/insights"
                body: Stack {
                  Heading { "Insights", level: 1 },
                  QueryView {
                    of: Shop.CatalogSize,
                    loading: Text { "Loading…" }, error: Text { "Failed" }, empty: Text { "No data." },
                    data: t => Card { "Catalog", Text { t.products }, Text { t.stockValue } }
                  },
                  QueryView {
                    of: Shop.ProductsByStatus,
                    loading: Text { "Loading…" }, error: Text { "Failed" }, empty: Text { "No groups." },
                    data: rows => Stack { For { each: rows, g => Text { g.n } } }
                  },
                  // M-T1.3 Phase 4 — `Chart` on Flutter: a `CustomPainter` over
                  // the rows the page already watches, no charting package.
                  // Both kinds are here because the CALL SITES differ (`isBar`,
                  // and the series coercion over an int vs a money column), and
                  // `flutter analyze` is what proves the emitted Dart is real.
                  Chart { kind: "bar",  of: Shop.ProductsByStatus, x: r => r.status, y: r => r.n },
                  Chart { kind: "line", of: Shop.ProductsByStatus, x: r => r.status, y: r => r.n },
                  QueryView {
                    of: Shop.RevenueByStatus,
                    loading: Text { "Loading…" }, error: Text { "Failed" }, empty: Text { "No revenue." },
                    data: rows => Stack { For { each: rows, g => Money { g.revenue } } }
                  },
                  // A MONEY series — the coercion the `as num` cast broke.
                  Chart { kind: "bar", of: Shop.RevenueByStatus, x: r => r.status, y: r => r.revenue }
                }
              }
              page NewCategory { route: "/categories/new"  body: Stack { Heading { "New category", level: 1 }, WorkflowForm { runs: addCategory } } }
              page ProductAdmin { route: "/products/:id"  body: Stack {
                Heading { "Admin", level: 1 },
                OperationForm { of: Product, op: rename },
                OperationForm { of: Product, op: reprice },
                Modal { OperationForm { of: Product, op: rename }, trigger: Button { "Rename…" }, title: "Rename product" },
                DestroyForm { of: Product }
              } }
            }
            deployable api { platform: node contexts: [Cat] dataSources: [catState, catFiles] serves: ShopApi port: 3000 }
            deployable app { platform: flutter targets: api ui: MobileApp { Shop: api } port: 3006 }
          }
          DDD
          node bin/cli.js generate system ci-flutter/showcase.ddd -o ci-flutter/out
      - name: Locate the emitted Flutter project
        id: proj
        run: echo "dir=$(dirname "$(find ci-flutter/out -name pubspec.yaml | head -1)")" >> "$GITHUB_OUTPUT"
      - name: flutter pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get
      - name: flutter analyze (errors)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      # Runs the whole test/ dir: the boot smoke (widget_test.dart) AND the
      # runtime a11y gate (a11y_test.dart — WCAG meetsGuideline matchers, the
      # axe analogue for Flutter's canvas render).  See the Flutter a11y audit.
      - name: flutter test (runtime smoke + a11y guidelines)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter test
      - name: flutter build web (the real compile gate)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build web --release
      # SCAFFOLD PARITY — the gate this workflow was missing.  Everything above
      # builds a HAND-WRITTEN showcase, so nothing here ever compiled a
      # `with scaffold(...)` app; the scaffolded List/Detail pages were broken
      # in four independent ways (a JS object literal emitted into Dart, a
      # provider referenced before its state binding, unbound route params, and
      # a comment where a Widget was required) and the gate could not see any of
      # them.  This leg generates one and holds it to the same bar, plus a
      # widget test that drives the SERVER-DRIVEN `Table` controls: Flutter web
      # renders to canvas, so a DOM smoke is not available and `flutter test` is
      # where runtime behaviour is provable.
      - name: Generate the scaffold-parity app
        run: |
          mkdir -p ci-flutter-scaffold
          cat > ci-flutter-scaffold/scaffold.ddd <<'DDD'
          system Shop {
            subdomain Sales {
              context Orders {
                aggregate Product with crudish { name: string  price: money }
                aggregate Customer with crudish { name: string  email: string }
                repository Products for Product { }
                repository Customers for Customer { }
              }
            }
            api ShopApi from Sales
            storage pg { type: postgres }
            resource ordersState { for: Orders, kind: state, use: pg }
            ui App with scaffold(aggregates: [Product, Customer]) { api Shop: ShopApi }
            deployable api { platform: node contexts: [Orders] dataSources: [ordersState] serves: ShopApi port: 3000 }
            deployable app { platform: flutter targets: api ui: App { Shop: api } port: 3006 }
          }
          DDD
          node bin/cli.js generate system ci-flutter-scaffold/scaffold.ddd -o ci-flutter-scaffold/out
      - name: Locate the scaffold project
        id: sproj
        run: echo "dir=$(dirname "$(find ci-flutter-scaffold/out -name pubspec.yaml | head -1)")" >> "$GITHUB_OUTPUT"
      # PER-AGGREGATE PAGE IDENTITY — the assertion the build alone cannot make.
      # The scaffold names aggregate pages by ROLE (`List` inside `area Products`),
      # so an emitter keying its file/class on the bare `page.name` collapses
      # EVERY aggregate's list onto one `lib/pages/list_page.dart` + one
      # `ListPage`, and `main.dart` routes both `/products` and `/customers` to
      # whichever was written last — `/products` renders the Customers list.
      # Dart grades a duplicate import as an `info`, and this job runs
      # `flutter analyze --no-fatal-infos`, so the collision compiled, tested and
      # built CLEAN.  That is why the scaffold case declares TWO aggregates now
      # (it had exactly one, which cannot express the bug) and why the check is
      # an explicit assertion rather than another build step.
      - name: Assert per-aggregate scaffold pages are distinct
        working-directory: ${{ steps.sproj.outputs.dir }}
        run: |
          set -eu
          echo "--- lib/pages ---"; ls lib/pages
          for f in product_list_page.dart product_detail_page.dart \
                   customer_list_page.dart customer_detail_page.dart; do
            test -f "lib/pages/$f" || { echo "MISSING lib/pages/$f — per-aggregate pages collapsed onto one file"; exit 1; }
          done
          test ! -f lib/pages/list_page.dart || { echo "lib/pages/list_page.dart exists — role-named page file is back"; exit 1; }
          grep -q "const ProductListPage()" lib/main.dart || { echo "no ProductListPage route in main.dart"; exit 1; }
          grep -q "const CustomerListPage()" lib/main.dart || { echo "no CustomerListPage route in main.dart"; exit 1; }
          # Each import URI appears exactly once — a repeated one means two pages
          # resolved to a single module.
          dupes=$(grep "^import 'pages/" lib/main.dart | sort | uniq -d)
          test -z "$dupes" || { echo "duplicate page imports in main.dart:"; echo "$dupes"; exit 1; }
      - name: Drop in the Table-controls widget test
        working-directory: ${{ steps.sproj.outputs.dir }}
        run: cp "$GITHUB_WORKSPACE/scripts/flutter-table-controls-test.dart" test/table_controls_test.dart
      - name: flutter analyze + test + build web (scaffold)
        working-directory: ${{ steps.sproj.outputs.dir }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter build web --release

      # APP-SHELL PARITY — `auth: ui` + realtime SSE + the `persist:` store
      # ladder + `ProvenanceInfo`, the four features that all land in the SAME
      # place: `main.dart`'s root and the per-page shell.  They compose (the
      # session gate and the realtime subscription share `MaterialApp.builder`;
      # the url store wraps `MaterialApp`; a gated page binds `currentUser`
      # before its route args), and NOTHING above exercises any of them — the
      # showcase is unauthenticated and store-free.  Each also pulls a pub
      # package on demand (`url_launcher` / `web` / `shared_preferences`), so
      # this leg is the only place a resolution conflict would surface.
      - name: Generate the app-shell parity app (auth + realtime + persist + provenance)
        run: |
          mkdir -p ci-flutter-shell
          cat > ci-flutter-shell/shell.ddd <<'DDD'
          system Quartet {
            user { id: string  role: string  permissions: string[] }
            auth { provider: keycloak oidc { issuer: env("OIDC_ISSUER") clientId: env("OIDC_CLIENT_ID") } }
            subdomain Sales {
              context Orders {
                aggregate Order {
                  code: string
                  quantity: int
                  unitPrice: int
                  total: int provenanced
                  operation reprice(qty: int, price: int) {
                    quantity := qty
                    unitPrice := price
                    total := qty * price
                  }
                  operation approve() requires currentUser.role == "admin" { code := code }
                  derived display: string = code
                }
                repository Orders for Order { }
                event OrderPlaced { order: Order id, at: datetime }
                channel Lifecycle { carries: OrderPlaced  delivery: broadcast  retention: ephemeral }
              }
            }
            api ShopApi from Sales
            storage pg { type: postgres }
            resource ordersState { for: Orders, kind: state, use: pg }
            deployable api {
              platform: node contexts: [Orders] dataSources: [ordersState] serves: ShopApi port: 3000 auth: required
            }
            ui MobileApp {
              framework: flutter
              api Shop: ShopApi
              channel Live: Orders.Lifecycle
              on Live.OrderPlaced(e) { toast("Order " + e.order + " placed") refetch(Order) }
              store Cart persist: local {
                state { lines: string[]  count: int = 0  subtotal: money }
                action add(sku: string) { lines += sku  count += 1 }
              }
              store Recent persist: session {
                state { lastCode: string = "" }
                action remember(c: string) { lastCode := c }
              }
              store Filters persist: url {
                state { q: string = ""  pageNo: int = 1  onlyOpen: bool = false }
                action setQ(v: string) { q := v }
              }
              page Home {
                route: "/"
                body: Stack {
                  Heading { "Orders", level: 1 },
                  Text { currentUser.id },
                  Text { Filters.q },
                  Text { Recent.lastCode },
                  For { each: Cart.lines, l => Card { l } },
                  QueryView {
                    of: Shop.Order.all,
                    loading: Text { "Loading…" }, error: Text { "Failed" }, empty: Text { "None yet." },
                    data: rows => Stack { For { each: rows, o => Card { o.code } } }
                  }
                }
              }
              page Admin {
                route: "/admin"
                requires currentUser.role == "admin"
                body: Stack { Heading { "Admin", level: 1 } }
              }
              page OrderDetail {
                route: "/orders/:id"
                body: QueryView {
                  of: Shop.Order.byId(id),
                  loading: Text { "Loading…" }, error: Text { "Failed" }, empty: Text { "Not found." },
                  data: o => Stack {
                    Text { o.code },
                    Text { o.total },
                    ProvenanceInfo { of: o, field: "total" },
                    Action { o.approve }
                  }
                }
              }
            }
            deployable app { platform: flutter targets: api ui: MobileApp { Shop: api } port: 3006 auth: ui }
          }
          DDD
          node bin/cli.js generate system ci-flutter-shell/shell.ddd -o ci-flutter-shell/out
      - name: Locate the app-shell project
        id: shproj
        run: echo "dir=$(dirname "$(find ci-flutter-shell/out -name pubspec.yaml | head -1)")" >> "$GITHUB_OUTPUT"
      - name: flutter analyze + test + build web (app shell)
        working-directory: ${{ steps.shproj.outputs.dir }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter build web --release

      # Native mobile surface (Phase 3) — prove the SAME kind of emitted Dart
      # source compiles for Android too.  `flutter build apk` is the native "is
      # the Dart real" gate.  It builds a SEPARATE, minimal Loom app (no
      # FileUpload) rather than the full showcase: the showcase's FileUpload pulls
      # the third-party `file_picker` native plugin, whose Android build needs a
      # newer compileSdk than the stock `flutter create` template ships — that's
      # a file_picker packaging requirement, not a Loom codegen concern, and
      # FileUpload's Dart is already compile-proven by `flutter analyze` +
      # `flutter build web` above.  Java 17 + the Android SDK are set up here.
      # iOS needs a macOS host — deferred.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # One bounded retry on the SDK install: a transient CDN corruption
      # ("Error on ZipFile unknown archive", run 32761021024) killed the whole
      # apk gate before any project code ran — the same transient-infra class
      # the elixir gates retry (docker pull, mix deps.get).  A second failure
      # is real and still fails the job.
      - uses: android-actions/setup-android@v3
        id: setup-android
        continue-on-error: true
      - uses: android-actions/setup-android@v3
        if: steps.setup-android.outcome == 'failure'
      - name: Generate a minimal (FileUpload-free) app for the native apk gate
        run: |
          mkdir -p ci-flutter-apk
          cat > ci-flutter-apk/apk.ddd <<'DDD'
          system ApkSmoke {
            api ShopApi from Cat
            subdomain Cat { context C {
              aggregate Product {
                name: string
                price: int
                operation rename(newName: string) { name := newName }
              }
              repository Products for Product { }
            } }
            storage db { type: postgres }
            resource st { for: C, kind: state, use: db }
            ui MobileApp {
              framework: flutter
              api Shop: ShopApi
              page Home {
                route: "/"
                state { note: string = "" }
                body: Stack {
                  Heading { "Products", level: 1 },
                  QueryView {
                    of: Shop.Product.all,
                    loading: Text { "Loading" }, error: Text { "Failed" }, empty: Text { "None" },
                    data: rows => Stack { For { each: rows, p => Card { p.name, Text { p.price } } } }
                  },
                  Field { "Note", bind: note },
                  CreateForm { of: Product },
                  Button { "New", to: "/new" }
                }
              }
              page New { route: "/new"  body: Stack { Heading { "New", level: 1 }, CreateForm { of: Product } } }
            }
            deployable api { platform: node contexts: [C] dataSources: [st] serves: ShopApi port: 3000 }
            deployable app { platform: flutter targets: api ui: MobileApp { Shop: api } port: 3006 }
          }
          DDD
          node bin/cli.js generate system ci-flutter-apk/apk.ddd -o ci-flutter-apk/out
      - name: flutter create android platform + build apk
        run: |
          APK_DIR="$(dirname "$(find ci-flutter-apk/out -name pubspec.yaml | head -1)")"
          cd "$APK_DIR"
          flutter pub get
          flutter create --platforms=android .
          flutter build apk --debug
