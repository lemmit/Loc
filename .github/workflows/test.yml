name: Tests + coverage

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - 'vitest.config.ts'
      - 'biome.json'
      - 'biome.generated.json'
      - 'designs/**'
      - '.github/workflows/test.yml'
  # Deliberately UNFILTERED on pull requests: `tests passed` is a required
  # status check, and a required check that gets path-skipped never reports —
  # blocking the PR on "Expected" forever.  Running the fast suite on a
  # docs-only PR costs a few minutes; stranding the PR costs an admin bypass.
  # It is also pr-gate's floor: at least one check reports on EVERY PR, so
  # pr-gate's "nothing reported" arm stays a real failure signal
  # (docs/ci-gating.md → "No merge queue on a personal account").
  pull_request:
  merge_group:
  # Nightly: the coverage run.  Coverage is collected ONLY here — it taxed
  # every per-PR shard (v8 instrumentation + a blob-merge job that needed a
  # second `npm ci`) to produce a report nobody read per PR.  The scheduled
  # run executes the whole suite once, instrumented, and publishes the HTML.
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read

# Cancel in-flight runs of the same branch when a new commit lands —
# saves CI minutes on rebases / force-pushes (mirrors the pattern in
# playground-e2e.yml and generated-react-build.yml).  The latest
# commit is what ultimately gets gated.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast vitest suite, sharded across N runners with `vitest --shard`.
  #
  # vitest.config.ts splits the suite into three projects: `unit` (shares one
  # module graph per worker — `isolate: false` — which is what took the suite
  # from ~20 min to ~6 min single-job), `mocked` (the few files that vi.mock a
  # src module and need per-file isolation) and `corpus` (the four whole-corpus
  # censuses, >30 s each).  The shards run unit + mocked; corpus gets its own
  # job below so no single 95 s file pins a shard's wall-clock.  No coverage
  # here — see the nightly `coverage` job.  Bump the matrix (and the `/4`
  # denominators) together to add shards.
  test:
    name: test (shard ${{ matrix.shard }}/4)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel sibling shards when one fails — we want the full
      # failure picture across the whole suite in a single run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      # `npm ci` runs the `prepare` lifecycle (langium:generate + build),
      # which produces src/language/generated/ + out/ — required before
      # vitest transforms any file that imports the generated AST, and
      # before the CLI tests spawn `node bin/cli.js` (which runs `out/`).
      - name: Install (runs langium:generate + build)
        run: npm ci

      - name: Test (shard ${{ matrix.shard }}/4)
        run: npm test -- --project unit --project mocked --shard=${{ matrix.shard }}/4 --reporter=default

  # The whole-corpus censuses (`corpus` project): each iterates every tracked
  # `.ddd`, 30–95 s per file.  One job, alongside the shards.
  corpus:
    name: test (corpus censuses)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      - name: Install (runs langium:generate + build)
        run: npm ci

      - name: Test (corpus censuses)
        run: npm test -- --project corpus --reporter=default

  # Nightly only: the whole suite once, under v8 coverage, with the HTML
  # report as an artifact and the totals in the step summary.  Not a PR gate.
  coverage:
    name: coverage (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      - name: Install (runs langium:generate + build)
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage -- --reporter=default

      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "coverage/coverage-summary.json";
            if (!fs.existsSync(p)) { console.log("no coverage summary"); process.exit(0); }
            const t = JSON.parse(fs.readFileSync(p, "utf8")).total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            const md = [
              "## Coverage",
              "",
              "| Metric | % | Covered/Total |",
              "| --- | --- | --- |",
              row("statements"), row("branches"), row("functions"), row("lines"),
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

  # Biome gates + the web/ typecheck, split off the test shards so they run
  # once (not 4×) and in parallel with them: `biome ci` over the repo, the
  # generated-code Biome gate (emits TS/TSX projects and lints them), the
  # contrast gate, then the playground typecheck + DDL unit guard.  One job
  # instead of two (the old separate `web-tsc`) — each half is ~1min of
  # mostly-install, and a runner SLOT is the scarce resource on this account,
  # not wall-clock (docs/ci-gating.md, "Draft PRs and the runner queue").
  lint:
    name: lint + web-tsc
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      - name: Install (runs langium:generate + build)
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Generated-code Biome gate
        run: npm run test:biome-gen

      # accessibility.md — static per-pack WCAG-AA design-token contrast gate.
      - name: Design-token contrast gate
        run: npm run test:contrast

      # web/ resolves `../src/language/generated/**` at typecheck time; the
      # root `npm ci` above already produced it.
      - name: Install web
        working-directory: web
        run: npm ci

      # `npm run build` in web/ chains `tsc -b && vite build`; we only need
      # the typecheck for this gate, so invoke `tsc` directly.
      - name: Typecheck web
        working-directory: web
        run: npx tsc -b

      # Network-free unit guard for the runtime DDL synth — pre-merge gate
      # for the per-context-pgSchema regression (system-mode backends query
      # schema-qualified tables).  The end-to-end e2e/runtime.spec.ts covers
      # the same path but self-skips when the npm registry is unreachable,
      # so it doesn't gate reliably; this does.
      - name: Test runtime DDL synth
        working-directory: web
        run: npm run test:ddl

  # Single roll-up status for branch protection: succeeds only when every
  # shard, the corpus job, and the lint gates pass.  Require THIS check
  # instead of the per-shard `test (shard i/4)` jobs so the shard count can
  # change without editing branch-protection rules.
  tests-passed:
    name: tests passed
    needs: [test, corpus, lint]
    # `!cancelled()` so the rollup still runs (and reports red) when a real
    # job fails, but SKIPS on cancellation — otherwise a superseded run's
    # skipped need trips the gate and the stale SHA shows a spurious failure
    # instead of "cancelled".  Not on the nightly coverage run: its needs
    # are all skipped there, and nothing gates on a schedule.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on upstream job results
        run: |
          echo "test=${{ needs.test.result }} corpus=${{ needs.corpus.result }} lint=${{ needs.lint.result }}"
          [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.corpus.result }}" = "success" ] \
            && [ "${{ needs.lint.result }}" = "success" ]

