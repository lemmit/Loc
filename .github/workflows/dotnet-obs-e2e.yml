name: .NET observability events (runtime e2e)

# Boots the generated .NET backend against a real postgres sidecar, hits
# /health, then asserts the JSON-per-line stdout from AddJsonConsole
# carries the catalog envelope:
#   server_starting → server_listening → request_start → request_end →
#   server_shutdown → server_drained
#
# Catches drift the unit tests miss — e.g. ASP.NET silently dropping the
# State.Event scope key, IHostApplicationLifetime callbacks racing,
# duration_ms losing its integer type at the framework boundary.
#
# TIER: per-PR, path-scoped, binding through `pr-gate` — with `push: main`
# kept as the post-merge regression net.  Promoted out of push:main-only by
# wave G1 packet 1.1 of docs/new-plan/verification-waves-2026-09.md: the unit
# tests and conformance parity catch the structural bugs, but the runtime-only
# ones above were only ever caught AFTER the merge, on a red `main`.  A revert
# is not cheaper than not merging it.  The `run-obs` label opt-in is removed;
# the draft guard on the job below keeps draft PRs on the fast lane.
#
# The per-PR `paths:` block is deliberately NARROW — this gate's real blast
# radius is `src/ir/**`, `src/generator/dotnet/**`, `src/generator/_obs/**`,
# `src/platform/dotnet.ts` and its own e2e test file.  Narrowness IS the
# anti-abuse answer: five obs boots firing together on every PR would be the
# docker / runner burst anti-abuse heuristics watch for on public repos, so
# the paths are cut so a typical PR fires one or two of the five siblings,
# never all five (and the docker-postgres tax is paid only by a PR that
# actually touches the .NET emission path).  The broader generation path
# stays on the `push: main` block above.
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/dotnet/**'
      - 'src/generator/_obs/**'
      - 'src/platform/dotnet.ts'
      - 'test/e2e/observability-events-dotnet.test.ts'
      - 'package.json'
      - '.github/workflows/dotnet-obs-e2e.yml'
  workflow_dispatch:
  merge_group:
  # Per-PR, path-scoped: fires on this gate's real blast radius (below), and
  # is binding because `pr-gate` fails on any non-passing check run present on
  # the head SHA.  The `run-obs` label opt-in is gone -- a labeled trigger is
  # `false` on opened/synchronize and exempts the file from draft-gate
  # enforcement.  `ready_for_review` is what re-fires the leg when a draft
  # flips.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # DUPLICATED list, never a YAML anchor: the reader in
      # test/system/workflow-path-coverage.test.ts does not resolve
      # `&paths` / `*paths`, so an anchored list is silently outside that
      # gate.  Deliberately narrower than the `push:` block above -- that one
      # carries the whole generation path (language/macros/ir/system/util) as
      # the post-merge net, and the coverage test unions globs across
      # triggers, so this block only needs the per-PR blast radius.
      - 'src/ir/**'
      - 'src/generator/dotnet/**'
      - 'src/generator/_obs/**'
      - 'src/platform/dotnet.ts'
      - 'test/e2e/observability-events-dotnet.test.ts'
      - '.github/workflows/dotnet-obs-e2e.yml'
permissions:
  contents: read

concurrency:
  # Keyed on the PR number when there is one so a superseded PR push cancels
  # its own in-flight boot; `push: main` runs keep per-ref attribution and are
  # never cancelled (cancel-in-progress is false off `pull_request`).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet-obs-e2e:
    runs-on: ubuntu-latest
    # Draft PRs run only the fast lane (test.yml, langium-generated,
    # workflow-lint, pr-gate); this leg fires once the PR is marked ready for
    # review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    # Pinned verbatim by test/system/draft-gate.test.ts.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Cold path: nuget restore + dotnet build + postgres pull is ~3-5min.
    # Warm path (with the build cache below): ~60s.  10min leaves
    # headroom without letting a hung server burn through quota.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Loom toolchain — npm ci runs the `prepare` lifecycle which
      # populates src/language/generated/ (langium output is gitignored,
      # required before tsc and any vitest transform).
      - name: Install Loom toolchain
        run: npm ci

      # The e2e test calls `bin/cli.js generate dotnet ...` then spawns
      # `dotnet run`.  Both work against the host filesystem; we don't
      # pre-generate here — the test itself does, into a tmpdir.

      # Pre-warm the NuGet HTTP cache.  Without this, every run pays the
      # full ~2-3min cold restore against api.nuget.org.  The cache key
      # tracks the docker tag baked into the generated csproj so the cache
      # invalidates when the dep set changes.
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          # Hash the .NET emitter source so any change to the generated
          # csproj (TargetFramework bump, package ref add) mints a fresh
          # entry.  Avoids stale caches that mask dep-related failures.
          key: nuget-obs-${{ hashFiles('src/generator/dotnet/emit/program.ts') }}
          restore-keys: |
            nuget-obs-

      - name: Run .NET observability runtime e2e
        env:
          LOOM_OBS_E2E_DOTNET: '1'
          # The test pulls postgres:18-alpine via the docker CLI; the
          # github-actions runner has docker available without extra
          # setup, but we set DOCKER_BUILDKIT=1 for faster image fetches.
          DOCKER_BUILDKIT: '1'
        run: npx vitest run test/e2e/observability-events-dotnet.test.ts --reporter=verbose

      # Surface stdout of the failing test as a step-summary annotation.
      # The test captures the .NET server's stdout; on failure it embeds
      # the first 4kB in the assertion message, which vitest --reporter=verbose
      # prints to the job log already.  This step just makes that log
      # easier to find via the run-summary page.
      - name: Surface failure context
        if: failure()
        run: |
          echo '## .NET runtime e2e failed' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'See the "Run .NET observability runtime e2e" step above for the captured server stdout.' >> $GITHUB_STEP_SUMMARY
          echo 'The test asserts the AddJsonConsole stream carries the catalog envelope (server_starting → server_listening → request_start → request_end → server_shutdown → server_drained).' >> $GITHUB_STEP_SUMMARY
