name: Corpus compile gate (Elixir)

# The FIFTH backend cell of the per-feature corpus compile matrix (M-T9.10).
# corpus-build.yml compiles every corpus feature on tsc/dotnet/java/python but
# deliberately left Elixir out — it's the one backend that needs the docker
# hexpm image + (behind a TLS-fingerprinting egress proxy) the LOOM_HEX_MIRROR
# loopback CA dance, so it was "wired separately as a follow-up" (see that
# workflow's header).  This is that follow-up.
#
# Before this gate, every corpus feature's Elixir emission was generation-
# verified per-PR (corpus-coverage) but only COMPILE-checked in the nightly
# cross-backend conformance run — so an Elixir codegen regression on any corpus
# feature shipped green until the nightly.  This closes that silent gap: each
# feature's generated plain-Ecto/Phoenix project is `mix compile
# --warnings-as-errors`-checked inside the hexpm/elixir image, per PR.
#
# The generate + compile loop lives in `test/e2e/corpus-elixir-build.test.ts`
# (entrypoint `npm run test:elixir-corpus`); the feature list is computed inside
# the test from the shared manifest (test/fixtures/corpus/manifest.ts, key
# `vanilla`) minus that backend's ELIXIR_COMPILE_SKIP map — one source of truth.
#
# Sharded one feature per cell (like elixir-vanilla-build.yml): a cold docker
# `mix deps.get` + compile per feature comfortably fits a per-cell timeout, and
# a `configure` job enumerates the corpus fixtures dynamically so adding a
# `<feature>.ddd` needs no workflow edit.  CI has direct hex.pm access, so
# LOOM_HEX_MIRROR stays unset here (a no-op).
#
# Triggers: any change to the elixir generator subtree, the shared expression
# seam, the IR, the elixir platform surface / deployable validator, the corpus
# fixtures, or this leg's test — plus push:main and manual dispatch.

on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/elixir/**'
      - 'src/generator/_expr/**'
      - 'src/platform/elixir.ts'
      - 'test/fixtures/corpus/**'
      - 'test/e2e/corpus-elixir-build.test.ts'
      - 'test/e2e/support/hex-mirror.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/corpus-elixir-build.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/elixir/**'
      - 'src/generator/_expr/**'
      - 'src/platform/elixir.ts'
      - 'test/fixtures/corpus/**'
      - 'test/e2e/corpus-elixir-build.test.ts'
      - 'test/e2e/support/hex-mirror.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/corpus-elixir-build.yml'
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enumerate the corpus feature fixtures dynamically so dropping a
  # `<feature>.ddd` under test/fixtures/corpus/ extends the matrix with no
  # workflow edit.  Output is JSON consumed by the matrix below via `fromJSON`.
  # A feature excluded from `vanilla` (or listed in ELIXIR_COMPILE_SKIP) still
  # gets a cell, but the test filters it out → 0 tests → `--passWithNoTests`
  # keeps the cell green; the test stays the single source of truth for what
  # actually compiles.
  configure:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        run: |
          features=$(for f in test/fixtures/corpus/*.ddd; do
            basename "$f" .ddd
          done | jq -R . | jq -cs .)
          echo "matrix={\"feature\":$features}" >> "$GITHUB_OUTPUT"

  # One job PER corpus feature (sharded).  A fully cold cell is ONE feature:
  # npm ci + toolchain build, generate, then a docker `mix deps.get` + `mix
  # compile --warnings-as-errors` (~2-3 min) — always fits the timeout.
  corpus-elixir:
    needs: configure
    runs-on: ubuntu-latest
    strategy:
      # Surface every broken feature rather than aborting on the first.
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    timeout-minutes: 20
    name: ${{ matrix.feature }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      # `npm ci` runs the `prepare` lifecycle (langium:generate + build); the
      # toolchain compiles before the test's `generate system` step needs it.
      # Docker Hub pulls flake: a registry timeout (Client.Timeout on
      # registry-1.docker.io) killed an otherwise-green cell on #2380 with
      # exit 125 before any compile ran. Pre-pull with backoff so a transient
      # hiccup costs seconds, not the cell. The tag is grepped from the test
      # file — the single source of truth — so a version bump cannot drift.
      - name: Pre-pull the hexpm/elixir image (retries)
        run: |
          IMG=$(grep -ohE 'hexpm/elixir:[A-Za-z0-9._-]+' test/e2e/corpus-elixir-build.test.ts | head -1)
          echo "pre-pulling $IMG"
          for i in 1 2 3 4; do
            docker pull "$IMG" && exit 0
            echo "pull failed (attempt $i), retrying in $((i*10))s"; sleep $((i*10))
          done
          exit 1

      - name: Install Loom toolchain
        run: npm ci

      # `--passWithNoTests` so a feature the manifest excludes from `vanilla`
      # (or one in ELIXIR_COMPILE_SKIP) yields an empty `it.each` and still
      # passes — the test's filter, not the matrix, decides what compiles.
      - name: mix compile this corpus feature (Elixir/Phoenix)
        env:
          LOOM_ELIXIR_BUILD: "1"
          LOOM_CORPUS_ELIXIR_CASE: ${{ matrix.feature }}
        run: npx vitest run test/e2e/corpus-elixir-build.test.ts --passWithNoTests

      - name: Surface failure context
        if: failure()
        run: |
          echo "## Corpus Elixir compile failed: ${{ matrix.feature }}" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'See the "mix compile this corpus feature" step above for the captured `mix deps.get` + `mix compile --warnings-as-errors` diagnostics.' >> $GITHUB_STEP_SUMMARY
          echo 'This cell generates `test/fixtures/corpus/${{ matrix.feature }}.ddd` on `platform: elixir` and compiles it in the hexpm/elixir image via `test/e2e/corpus-elixir-build.test.ts` (LOOM_CORPUS_ELIXIR_CASE=${{ matrix.feature }}).' >> $GITHUB_STEP_SUMMARY

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  The jobs above are a matrix
  # (or a fan-out), so their check names are dynamic and cannot be named as
  # a required status check; this job can.  A skipped need counts as OK — a
  # label-guarded or path-skipped job is a legitimate no-op.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  corpus-elixir-build-passed:
    name: corpus-elixir-build-passed
    # `!cancelled()`, not `always()`: when a newer push supersedes this run,
    # cancel-in-progress cancels the needed jobs — always() would then wake
    # this rollup later and convert the quiet supersession into a spurious
    # FAILURE check on the stale SHA (webhook noise for anyone babysitting
    # the PR). !cancelled() skips the rollup with the run; a LONE cancelled
    # need on a live run (a job timeout) still fails via the step below —
    # that is the "cancelled reads as not-failed" trap, kept closed. Same
    # pattern as test.yml's tests-passed.
    if: ${{ !cancelled() }}
    needs: [configure, corpus-elixir]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
