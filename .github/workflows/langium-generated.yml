name: Langium generated files in sync

on:
  push:
    branches: [main]
    paths:
      - 'src/language/ddd.langium'
      - 'src/language/generated/**'
      - 'langium-config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/langium-generated.yml'
  pull_request:
    paths:
      - 'src/language/ddd.langium'
      - 'src/language/generated/**'
      - 'langium-config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/langium-generated.yml'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      # Install without running the `prepare` lifecycle so we can re-run
      # langium:generate against the checked-in files and diff the result.
      - name: Install deps (skip prepare)
        run: npm ci --ignore-scripts

      - name: Regenerate Langium artifacts
        run: npm run langium:generate

      - name: Fail if generated files drifted
        run: |
          if ! git diff --quiet -- src/language/generated; then
            echo "::error::src/language/generated/ is out of date — run 'npm run langium:generate' and commit the result."
            git diff -- src/language/generated
            exit 1
          fi
