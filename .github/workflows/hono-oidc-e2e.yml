name: Hono OIDC auth (runtime e2e)

# Runtime-verifies the OIDC turnkey-auth chain (D-AUTH-OIDC) end-to-end:
# boots a REAL Keycloak (the bundled dev realm import) + postgres in
# docker, runs the generated Hono backend natively, gets a real token for
# the seeded `demo` user via the password grant, and asserts the generated
# OidcUserVerifier validates it against Keycloak's live JWKS and maps the
# configured claims (incl. the dotted realm_access.roles path) onto User.
#
# This is the runtime check the compile-only Hono / .NET OIDC build gates
# can't give.  ubuntu-latest ships docker; the backend runs in pure Node
# (lazy pg pool), Keycloak + postgres are pulled images (no build).
#
# Triggers `push: main` + manual dispatch only — NOT per-PR (sibling to
# the *-obs-e2e jobs; same rationale: regression net, not a PR gate, and
# Keycloak boot is heavier than a unit suite).
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/typescript/**'
      - 'src/platform/hono/**'
      - 'test/e2e/auth-oidc-e2e.test.ts'
      - 'test/e2e/fixtures/auth-oidc-e2e.ddd'
      - 'package.json'
      - '.github/workflows/hono-oidc-e2e.yml'
  workflow_dispatch:
  merge_group:
  # On-demand per-PR run: apply the `run-oidc` label to a PR to run this
  # otherwise push:main-only suite against that branch before merge.  The
  # job-level `if` below restricts the labeled trigger to that one label.
  pull_request:
    types: [labeled]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hono-oidc-e2e:
    runs-on: ubuntu-latest
    # Skip the labeled trigger unless it's specifically `run-oidc`; push,
    # merge-queue, and manual (`workflow_dispatch`) runs always proceed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-oidc'
    # Keycloak boot (~25s) + the generated project's npm install (cold
    # ~3-4min) dominate.  12min cap.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      - name: Install Loom toolchain
        run: npm ci

      - name: Run Hono OIDC runtime e2e
        env:
          LOOM_AUTH_E2E: '1'
        run: npm run test:auth-e2e -- --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo '## Hono OIDC runtime e2e failed' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'See the "Run Hono OIDC runtime e2e" step above for the captured backend stdout.' >> $GITHUB_STEP_SUMMARY
          echo 'The test boots a real Keycloak + postgres, gets a token for the seeded `demo` user, and asserts the generated OIDC verifier validates it (JWKS) and maps the claims onto User.' >> $GITHUB_STEP_SUMMARY
