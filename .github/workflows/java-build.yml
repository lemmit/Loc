name: Java build verification

# Compiles a Java project generated from each test-fixture .ddd by
# `ddd generate system`, then runs `gradle testClasses bootJar`
# (compiles main + the emitted JUnit test sources, packages the jar).  Catches emission bugs
# in the Java generator that the string-match unit tests cannot see
# (missing imports, JPA mapping shapes Hibernate rejects, Spring Data
# signature drift, record/embeddable mismatches).
#
# Mirrors `dotnet-build.yml` (.NET → dotnet build /warnaserror) and
# `elixir-vanilla-build.yml` (Phoenix → mix compile --warnings-as-errors).
#
# Triggers:
#   - PRs that touch the Java generator, the java platform module, or
#     the java build fixtures.
#   - Pushes to main (full regression check).
#   - Manual dispatch.

on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/java/**'
      - 'src/generator/_expr/**'
      - 'src/platform/java.ts'
      - 'examples/**'
      - 'package.json'
      - '.github/workflows/java-build.yml'
      - 'test/e2e/generated-java-build.test.ts'
      - 'test/e2e/fixtures/java-build/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/java/**'
      - 'src/generator/_expr/**'
      - 'src/platform/java.ts'
      - 'examples/**'
      - 'package.json'
      - '.github/workflows/java-build.yml'
      - 'test/e2e/generated-java-build.test.ts'
      - 'test/e2e/fixtures/java-build/**'
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-generated-java:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Cold Gradle runs download the Spring Boot dependency tree (~2min);
    # warm runs with the ~/.gradle cache below are ~30s per fixture.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # Pin Gradle explicitly — the generated projects target a Java 25
      # toolchain, which requires Gradle 9.1+, newer than the runner's
      # pre-installed Gradle.  No wrapper is emitted, so this is what puts
      # a compatible `gradle` on PATH for `test:java`.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      # Cache the Gradle caches across runs.  Keyed on the build
      # template (the generated dependency set only moves when the
      # pinned versions in emit/program.ts move).
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/generator/java/emit/program.ts') }}
          restore-keys: |
            gradle-

      # Build the Loom toolchain.  `prepare` lifecycle runs
      # `langium:generate` which populates src/language/generated/.
      - name: Install Loom toolchain
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: gradle testClasses bootJar against each fixture
        run: npm run test:java

      - name: Surface gradle output on failure
        if: failure()
        run: |
          echo '## Tail of test:java output' >> $GITHUB_STEP_SUMMARY
          echo 'See the previous step log for full `gradle` diagnostics — the test inherits stdio so per-file errors appear there as `[ERROR]` lines.' >> $GITHUB_STEP_SUMMARY
