name: Elixir / Vanilla runtime e2e (observability)

# Boots the generated vanilla Phoenix backend against a real postgres
# sidecar, hits /health, then asserts the JSON-per-line stdout from the
# rendered <App>.LogFormatter carries the catalog envelope:
#   server_starting → server_listening → request_start → request_end →
#   server_shutdown → server_drained
#
# The Elixir observability runtime e2e gate.  Catches drift the unit
# tests miss — e.g. the shared `renderApplication` / `renderTelemetry` /
# `renderLogFormatter` not playing nice with the vanilla shell wiring
# (Repo, PubSub, RequestContext Plug, :logger formatter config).
#
# Triggers `push: main` + manual dispatch only — NOT per-PR.  Cold path
# is ~3-5min, so a 10min cap is comfortable.
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/elixir/vanilla/**'
      - 'src/generator/elixir/shell/**'
      - 'src/generator/elixir/telemetry-emit.ts'
      - 'src/generator/_obs/**'
      - 'src/platform/elixir.ts'
      - 'test/e2e/observability-events-elixir-vanilla.test.ts'
      - 'package.json'
      - '.github/workflows/elixir-vanilla-obs-e2e.yml'
  workflow_dispatch:
  # On-demand per-PR run: apply the `run-obs` label to a PR to run this
  # otherwise push:main-only suite against that branch before merge — the
  # same label fires all five `*-obs-e2e` siblings together (obs is one
  # feature across backends).  The job-level `if` below restricts the
  # labeled trigger to that one label so unrelated labels don't kick off
  # the boot.
  pull_request:
    types: [labeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vanilla-obs-e2e:
    runs-on: ubuntu-latest
    # Skip the labeled trigger unless it's specifically `run-obs`; push,
    # merge-queue, and manual (`workflow_dispatch`) runs always proceed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-obs'
    # Cold path: hex deps + plain Phoenix compile + postgres pull is
    # ~3-5min (plain Ecto dep set).  10min is comfortable.
    timeout-minutes: 10
    # Service container — pre-starts postgres on the host network with a
    # built-in healthcheck before any step runs.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      # erlef/setup-beam — pinned so the dep set resolves deterministically.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Install Loom toolchain
        run: npm ci

      # Cache the hex dep tree + _build outputs across runs.  The key
      # tracks the vanilla shell-emit module that emits mix.exs so a dep
      # change mints a fresh entry, but unrelated emitter tweaks reuse
      # the warm cache.
      - name: Cache hex deps + _build
        uses: actions/cache@v5
        with:
          path: |
            ~/.hex
            ~/.mix
          key: hex-mix-vanilla-${{ hashFiles('src/generator/elixir/vanilla/shell-emit.ts') }}
          restore-keys: |
            hex-mix-vanilla-

      - name: Run vanilla observability runtime e2e
        env:
          LOOM_OBS_E2E_PHOENIX_VANILLA: '1'
          # The test reads LOOM_OBS_PG_URL and skips its in-test
          # `docker run postgres` step when the URL is supplied.
          LOOM_OBS_PG_URL: 'postgres://postgres:postgres@127.0.0.1:5432'
          LOOM_OBS_PG_DB: 'api'
        run: npx vitest run test/e2e/observability-events-elixir-vanilla.test.ts --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo '## Vanilla Phoenix runtime e2e failed' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'See the runtime-e2e step above for the captured server stdout.' >> $GITHUB_STEP_SUMMARY
          echo 'Asserts the <App>.LogFormatter stream carries the catalog envelope (server_starting → server_listening → request_start → request_end → server_shutdown → server_drained).' >> $GITHUB_STEP_SUMMARY
