name: Elixir / Vanilla runtime e2e (observability)

# Boots the generated vanilla Phoenix backend against a real postgres
# sidecar, hits /health, then asserts the JSON-per-line stdout from the
# rendered <App>.LogFormatter carries the catalog envelope:
#   server_starting → server_listening → request_start → request_end →
#   server_shutdown → server_drained
#
# The Elixir observability runtime e2e gate.  Catches drift the unit
# tests miss — e.g. the shared `renderApplication` / `renderTelemetry` /
# `renderLogFormatter` not playing nice with the vanilla shell wiring
# (Repo, PubSub, RequestContext Plug, :logger formatter config).
#
# TIER: per-PR, path-scoped, binding through `pr-gate` — with `push: main`
# kept as the post-merge regression net.  Promoted out of push:main-only by
# wave G1 packet 1.1 of docs/new-plan/verification-waves-2026-09.md: a runtime
# gate that runs only after the merge can only ever report a red `main`.  Cold
# path is ~3-5min, so the 10min cap below is still comfortable.  The `run-obs`
# label opt-in is removed; the draft guard on the job below keeps draft PRs on
# the fast lane.
#
# The per-PR `paths:` block is deliberately NARROW — this gate's real blast
# radius is `src/ir/**`, `src/generator/elixir/vanilla/**`,
# `src/generator/elixir/shell/**`, `src/generator/elixir/telemetry-emit.ts`,
# `src/generator/_obs/**`, `src/platform/elixir.ts` and its own e2e test file.
# Narrowness IS the anti-abuse answer: five obs boots firing together on every
# PR would be the docker / runner burst anti-abuse heuristics watch for on
# public repos, so the paths are cut so a typical PR fires one or two of the
# five siblings, never all five.  The broader generation path stays on the
# `push: main` block above.
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/elixir/vanilla/**'
      - 'src/generator/elixir/shell/**'
      - 'src/generator/elixir/telemetry-emit.ts'
      - 'src/generator/_obs/**'
      - 'src/platform/elixir.ts'
      - 'test/e2e/observability-events-elixir-vanilla.test.ts'
      - 'package.json'
      - '.github/workflows/elixir-vanilla-obs-e2e.yml'
  workflow_dispatch:
  # Per-PR, path-scoped: fires on this gate's real blast radius (below), and
  # is binding because `pr-gate` fails on any non-passing check run present on
  # the head SHA.  The `run-obs` label opt-in is gone -- a labeled trigger is
  # `false` on opened/synchronize and exempts the file from draft-gate
  # enforcement.  `ready_for_review` is what re-fires the leg when a draft
  # flips.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # DUPLICATED list, never a YAML anchor: the reader in
      # test/system/workflow-path-coverage.test.ts does not resolve
      # `&paths` / `*paths`, so an anchored list is silently outside that
      # gate.  Deliberately narrower than the `push:` block above -- that one
      # carries the whole generation path (language/macros/ir/system/util) as
      # the post-merge net, and the coverage test unions globs across
      # triggers, so this block only needs the per-PR blast radius.
      - 'src/ir/**'
      - 'src/generator/elixir/vanilla/**'
      - 'src/generator/elixir/shell/**'
      - 'src/generator/elixir/telemetry-emit.ts'
      - 'src/generator/_obs/**'
      - 'src/platform/elixir.ts'
      - 'test/e2e/observability-events-elixir-vanilla.test.ts'
      - '.github/workflows/elixir-vanilla-obs-e2e.yml'
  merge_group:

permissions:
  contents: read

concurrency:
  # Keyed on the PR number when there is one so a superseded PR push cancels
  # its own in-flight boot; `push: main` runs keep per-ref attribution and are
  # never cancelled (cancel-in-progress is false off `pull_request`).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vanilla-obs-e2e:
    runs-on: ubuntu-latest
    # Draft PRs run only the fast lane (test.yml, langium-generated,
    # workflow-lint, pr-gate); this leg fires once the PR is marked ready for
    # review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    # Pinned verbatim by test/system/draft-gate.test.ts.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Cold path: hex deps + plain Phoenix compile + postgres pull is
    # ~3-5min (plain Ecto dep set).  10min is comfortable.
    timeout-minutes: 10
    # Service container — pre-starts postgres on the host network with a
    # built-in healthcheck before any step runs.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # erlef/setup-beam — pinned so the dep set resolves deterministically.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Install Loom toolchain
        run: npm ci

      # Cache the hex dep tree + _build outputs across runs.  The key
      # tracks the vanilla shell-emit module that emits mix.exs so a dep
      # change mints a fresh entry, but unrelated emitter tweaks reuse
      # the warm cache.
      - name: Cache hex deps + _build
        uses: actions/cache@v5
        with:
          path: |
            ~/.hex
            ~/.mix
          key: hex-mix-vanilla-${{ hashFiles('src/generator/elixir/vanilla/shell-emit.ts') }}
          restore-keys: |
            hex-mix-vanilla-

      - name: Run vanilla observability runtime e2e
        env:
          LOOM_OBS_E2E_PHOENIX_VANILLA: '1'
          # The test reads LOOM_OBS_PG_URL and skips its in-test
          # `docker run postgres` step when the URL is supplied.
          LOOM_OBS_PG_URL: 'postgres://postgres:postgres@127.0.0.1:5432'
          LOOM_OBS_PG_DB: 'api'
        run: npx vitest run test/e2e/observability-events-elixir-vanilla.test.ts --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo '## Vanilla Phoenix runtime e2e failed' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'See the runtime-e2e step above for the captured server stdout.' >> $GITHUB_STEP_SUMMARY
          echo 'Asserts the <App>.LogFormatter stream carries the catalog envelope (server_starting → server_listening → request_start → request_end → server_shutdown → server_drained).' >> $GITHUB_STEP_SUMMARY
