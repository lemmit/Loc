name: Generated Angular e2e

# Runtime e2e for the Angular frontend: generate the Angular project,
# `ng build` it, serve the static `dist/browser/` bundle with a tiny
# SPA-fallback static server, and run the SPA's own emitted Playwright smoke
# spec (every param-less page navigates + loads) against it.  The runtime
# sibling of generated-angular-build.yml — that gate compiles the bundle;
# this one proves it actually runs.
#
# TIERING — per-PR on the Angular blast radius, post-merge on everything
# else.  Wave G1 packet 1.2 of
# docs/new-plan/verification-waves-2026-09.md: a gate that runs only on
# `push: main` catches its regressions on a red `main`, so the cheap
# docker-free SPA smokes are promoted per-PR behind a narrow `paths:`.
#
#   pull_request  →  only what can actually change this bundle:
#                    `src/ir/**`; the Angular frontend generator
#                    (`src/generator/angular/**`,
#                    `src/platform/angular.ts`); the shared frontend seams
#                    every frontend rides (`_frontend/`, `_walker/`,
#                    `_packs/`, `frontend-dispatch.ts`); the three packs
#                    this matrix runs (`designs/angularMaterial`,
#                    `designs/primeng`, `designs/spartanNg`) and their
#                    stack (`stacks/ng1`); the Angular host template layer
#                    (`angular/`, `api/` — the dirs loader-fs.ts pulls in
#                    for an `angular` pack — plus `docker/` for the node
#                    deployable in the inline fixture); the test and this
#                    file.  The fixture is INLINE in the test, so there is
#                    no `examples/` glob.  A change confined to a
#                    non-Angular backend does not fire it.
#
#   push: main    →  the broad `src/**` net, UNCHANGED — the regression
#                    catch-all for whatever the narrow PR block misses,
#                    and what ci-red-alarm watches.  (It predates
#                    `angular/` and does not list it; the PR block does,
#                    and the union is what workflow-path-coverage reads.)
#
# Cost: no docker, no postgres sidecar.  One `npm ci` + toolchain build,
# then an `ng build` + Playwright run per pack — 3 jobs.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'designs/**'
      - 'api/**'
      - 'docker/**'
      - 'stacks/**'
      - 'test/e2e/generated-angular-e2e.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/generated-angular-e2e.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'src/ir/**'
      - 'src/generator/angular/**'
      - 'src/generator/_frontend/**'
      - 'src/generator/_walker/**'
      - 'src/generator/_packs/**'
      - 'src/platform/frontend-dispatch.ts'
      - 'src/platform/angular.ts'
      - 'designs/angularMaterial/**'
      - 'designs/primeng/**'
      - 'designs/spartanNg/**'
      - 'angular/**'
      - 'api/**'
      - 'docker/**'
      - 'stacks/ng1/**'
      - 'test/e2e/generated-angular-e2e.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/generated-angular-e2e.yml'
      # A change confined to a non-Angular backend cannot alter the
      # Angular bundle.  The positive list above is already narrow enough
      # to exclude these trees, so this tail is a guard against a future
      # widening of that list — and keeps the block legible against its
      # sibling generated-angular-build.yml, which needs it for real (it
      # filters on `src/**`).  Negations are ignored by
      # test/system/workflow-path-coverage.test.ts: it unions the
      # POSITIVE globs across triggers, and the push block above carries
      # the five generation trees for both.
      - '!src/generator/java/**'
      - '!src/generator/dotnet/**'
      - '!src/generator/python/**'
      - '!src/generator/elixir/**'
      - '!src/platform/java.ts'
      - '!src/platform/dotnet.ts'
      - '!src/platform/dotnet/**'
      - '!src/platform/python.ts'
      - '!src/platform/elixir.ts'
      - '!src/platform/hono/**'
      - '!src/platform/hono.ts'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs (runner slots are the scarce resource); keep
  # every push:main run so a red `main` stays attributable to its commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  angular-e2e:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: ['angularMaterial@v1', 'primeng@v1', 'spartanNg@v1']
    timeout-minutes: 25
    name: angular-scaffold × ${{ matrix.pack }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Root install runs the `prepare` lifecycle (langium:generate).
      - name: Install Loom toolchain
        run: npm ci

      - name: Build toolchain
        run: npm run build

      - name: Run angular runtime e2e
        env:
          LOOM_ANGULAR_E2E: '1'
          LOOM_ANGULAR_E2E_PACK: ${{ matrix.pack }}
        run: npx vitest run test/e2e/generated-angular-e2e.test.ts
