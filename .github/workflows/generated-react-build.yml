name: Generated React TSX build

# For each {example .ddd × design pack@version} cell, generate the React
# project, `npm install`, and `tsc --noEmit` it.  Catches generator
# drift that compiles the TS backend cleanly but breaks the generated
# TSX (missing imports, wrong prop types, JSX namespace issues) —
# invisible to the IR-level tests but breaks at user time.
#
# Matrix policy (configured by the `configure` job below):
#
#   - `pull_request` events    →  8-cell slice: showcase.ddd against
#                                  every pack@version.  showcase is
#                                  the feature-comprehensive
#                                  conformance fixture (#401) and
#                                  exercises the broadest generator
#                                  surface.  Misses per-example drift
#                                  (storybook-mantine / -shadcn,
#                                  loom-landing, banking, …) — caught
#                                  one merge later by:
#
#   - `push: main` /            →  full Cartesian, BATCHED PER EXAMPLE.
#     `merge_group` /               Heavy, but it's the regression safety
#     `workflow_dispatch`           net.  The keying is "anything that is
#                                   not a plain pull_request runs full",
#                                   so the merge queue gets the full sweep
#                                   on the rebased candidate — the pre-land
#                                   half of the tiering in docs/ci-gating.md.
#                                   `workflow_dispatch` runs full too
#                                   so a maintainer can force the
#                                   sweep on a branch if a PR-time
#                                   slim cell smelled suspicious.
#
# Sharding shape — why the full sweep is 18 jobs, not 144.  Every job
# pays ~4min of fixed cost (checkout + `npm ci` + `npm run build`) before
# it can run a ~60-90s cell.  One-runner-per-cell therefore spent ~85% of
# 144 runners on setup, took ~72min of wall clock (the tail is queueing,
# not work), and starved every other workflow of the org's runner pool —
# which matters more now that a merge-queue candidate fans out to ~35
# workflows (docs/ci-gating.md).
#
# So the full sweep batches by example: 18 jobs, each running all 8 packs
# for its one example in a single process via
# `LOOM_REACT_BUILD_CASE=<ddd>` (no `:pack` suffix = every pack; see
# test/e2e/generated-react-build.test.ts).  The fixed cost is paid once
# per 8 cells instead of once per cell, and the 2nd..8th generated-project
# `npm install`s reuse the tarball cache the first cell warmed.
# Expect ~4min setup + 8 × ~60-90s ≈ 12-16min per job, and a full sweep of
# ~15-20min wall clock (18 jobs fit the runner pool in one wave) for the
# same 144 cells of coverage.
#
# Coverage is UNCHANGED: same 18 examples × 8 packs, same assertions.
# The PR path is untouched — still 2 one-cell jobs, still ~5min.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'designs/**'
      - 'examples/**'
      - 'web/src/examples/**'
      - 'vite/**'
      - 'api/**'
      - 'docker/**'
      - 'test/e2e/generated-react-build.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/generated-react-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'designs/**'
      - 'examples/**'
      - 'web/src/examples/**'
      - 'vite/**'
      - 'api/**'
      - 'docker/**'
      - 'test/e2e/generated-react-build.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'langium-config.json'
      - '.github/workflows/generated-react-build.yml'
      # A change confined to a non-React backend cannot alter the React
      # bundle — skip this gate per-PR when only that code changed.  The
      # push:main trigger above keeps the broad `src/**` net post-merge.
      - '!src/generator/java/**'
      - '!src/generator/dotnet/**'
      - '!src/generator/python/**'
      - '!src/generator/elixir/**'
      - '!src/platform/java.ts'
      - '!src/platform/dotnet.ts'
      - '!src/platform/dotnet/**'
      - '!src/platform/python.ts'
      - '!src/platform/elixir.ts'
      - '!src/platform/hono/**'
      - '!src/platform/hono.ts'
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pick the matrix shape based on the event.  Output is a JSON
  # `{include: [{case, label}, …]}` consumed by the matrix job below via
  # `fromJSON`; `case` is the `LOOM_REACT_BUILD_CASE` spec for that job
  # and `label` is its display name.  Costs ~5 seconds of runner time —
  # negligible against the 142 cells we skip on a typical PR.
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Slim PR slice — 2 one-cell jobs.  showcase.ddd (the
            # feature-comprehensive cross-generator conformance fixture,
            # #401) × two representative packs: one Mantine (the React
            # baseline) and one shadcn (the Tailwind/Radix family).  This
            # catches nearly all pack-template / generator drift; the
            # remaining packs (mui, chakra, older versions) and per-example
            # drift are deferred to the push:main sweep below.  Full sweep
            # is one merge later — or force it with workflow_dispatch.
            EXAMPLES='["examples/showcase.ddd"]'
            PACKS='["mantine@v9","shadcn@v4"]'
            MATRIX=$(jq -cn --argjson ex "$EXAMPLES" --argjson packs "$PACKS" \
              '{include: [$ex[] as $e | $packs[] as $p | {case: "\($e):\($p)", label: "\($e) × \($p)"}]}')
          else
            # Full sweep — push:main, merge_group, workflow_dispatch: every
            # example × every pack, BATCHED one job per example.  A bare
            # `<ddd>` case (no `:pack` suffix) means "run all packs for this
            # example" in the harness, so the pack set lives in exactly one
            # place — `reactBuildPacks` in test/e2e/react-build-cases.ts —
            # and cannot drift from a duplicate list here.
            #
            # This EXAMPLES list MUST match the `reactBuildExamples` const in
            # test/e2e/react-build-cases.ts (pinned by the "CI matrix ↔
            # examples list stay in sync" guard in
            # test/e2e/react-build-matrix-sync.test.ts).
            # Single-file examples only: the harness copies one .ddd to
            # a temp dir, so multi-file examples with `import "./…"`
            # (erp/main.ddd, fulfillment-newest.ddd) can't be built here
            # — their coverage lives in playground-feature-examples.
            EXAMPLES='["examples/acme.ddd","examples/showcase.ddd","web/src/examples/banking-system.ddd","web/src/examples/inventory-system.ddd","web/src/examples/provenance-system.ddd","web/src/examples/sales-system.ddd","web/src/examples/storefront-system.ddd","web/src/examples/inheritance-system.ddd","web/src/examples/storybook-mantine.ddd","web/src/examples/storybook-shadcn.ddd","web/src/examples/storybook-components.ddd","web/src/examples/loom-landing.ddd","web/src/examples/action-showcase.ddd","web/src/examples/store-showcase.ddd","web/src/examples/dashboard-system.ddd","web/src/examples/subform-showcase.ddd","web/src/examples/data-grid-showcase.ddd","web/src/examples/file-upload-system.ddd","web/src/examples/file-scaffold-system.ddd","web/src/examples/expression-showcase.ddd"]'
            MATRIX=$(jq -cn --argjson ex "$EXAMPLES" \
              '{include: [$ex[] as $e | {case: $e, label: "\($e) × all packs"}]}')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  matrix:
    needs: configure
    runs-on: ubuntu-latest
    strategy:
      # Surface every broken cell rather than aborting the matrix on
      # the first red shard — easier to triage cross-pack regressions
      # when CI shows the full set.  (Within a batched job the cells are
      # separate `it`s, so a red pack doesn't hide the other seven either.)
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    # Sized for the batched full-sweep job: ~4min setup + 8 cells at
    # ~60-90s each.  A slim PR job runs one cell and finishes in ~5min.
    timeout-minutes: 45
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Root install runs the `prepare` lifecycle which calls
      # `langium:generate` to produce src/language/generated/.
      - name: Install Loom toolchain
        run: npm ci

      - name: Build toolchain
        run: npm run build

      - name: Run tsc-react shard
        env:
          # `<ddd>:<pack>` = one cell (slim PR slice); a bare `<ddd>` = every
          # pack for that example (full sweep).  A spec that matches nothing
          # throws — a silently-skipping shard is how this workflow once went
          # green while testing nothing.
          LOOM_REACT_BUILD_CASE: ${{ matrix.case }}
        run: npx vitest run test/e2e/generated-react-build.test.ts

  # Extern-component escape-hatch gate (not part of the example × pack
  # matrix): generate a project with an `extern` component, drop in a
  # hand-written widget, install + `tsc --noEmit`, and prove the typed
  # props contract bites — a correct widget compiles, a field-mismatch
  # one fails.  One runner, ~40s.
  extern-component:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: extern component props contract
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Loom toolchain
        run: npm ci

      - name: Build toolchain
        run: npm run build

      - name: Run extern-component build gate
        run: npm run test:tsc-react-extern

  # ── Merge-queue / branch-protection rollup ────────────────────────────
  # One stable check name for this workflow.  The jobs above are a matrix
  # (or a fan-out), so their check names are dynamic and cannot be named as
  # a required status check; this job can.  A skipped need counts as OK — a
  # label-guarded or path-skipped job is a legitimate no-op.  Kept honest by
  # test/system/merge-queue-readiness.test.ts; see docs/ci-gating.md.
  generated-react-build-passed:
    name: generated-react-build-passed
    # `!cancelled()`, not `always()`: when a newer push supersedes this run,
    # cancel-in-progress cancels the needed jobs — always() would then wake
    # this rollup later and convert the quiet supersession into a spurious
    # FAILURE check on the stale SHA (webhook noise for anyone babysitting
    # the PR). !cancelled() skips the rollup with the run; a LONE cancelled
    # need on a live run (a job timeout) still fails via the step below —
    # that is the "cancelled reads as not-failed" trap, kept closed. Same
    # pattern as test.yml's tests-passed.
    if: ${{ !cancelled() }}
    needs: [configure, matrix, extern-component]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
