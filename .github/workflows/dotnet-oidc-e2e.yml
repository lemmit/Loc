name: .NET OIDC auth (runtime e2e)

# Runtime-verifies the OIDC turnkey-auth chain (D-AUTH-OIDC) on the .NET
# backend, end-to-end: boots a REAL Keycloak (the bundled dev realm import)
# + postgres in docker, runs the generated .NET backend natively
# (`dotnet run`), gets a real token for the seeded `demo` user via the
# password grant, and asserts the generated OidcUserVerifier validates it
# against Keycloak's live JWKS and maps the configured claims (incl. the
# dotted realm_access.roles path) onto User.
#
# The .NET sibling of hono-oidc-e2e.yml — the runtime check the compile-only
# `dotnet build /warnaserror` gate can't give (it caught the http-issuer
# HttpDocumentRetriever.RequireHttps default that rejected every request).
# ubuntu-latest ships docker; the backend runs natively, Keycloak + postgres
# are pulled images (no build).
#
# TIER: per-PR, path-scoped, binding through `pr-gate` — with `push: main`
# kept as the post-merge regression net.  Promoted out of push:main-only by
# wave G1 packet 1.3 of docs/new-plan/verification-waves-2026-09.md: a
# runtime gate that runs only after the merge can only ever report a red
# `main`, so whatever it catches, it catches too late.  The `run-oidc` label
# opt-in is removed; the draft guard on the job below is what keeps draft
# PRs on the fast lane.
#
# The per-PR `paths:` block is the auth blast radius for THIS backend:
# `src/ir/**`, the .NET emission (`src/generator/dotnet/**`,
# `src/platform/dotnet.ts`),
# the shared auth emitters (`src/generator/_auth/**`,
# `src/generator/_frontend/auth-ui.ts`), this leg's e2e test + fixture, and
# this workflow file.  Nothing outside that list reaches this subject
# per-PR; the broader generation path stays on the `push: main` block.
#
# COST.  Every run pulls the Keycloak + postgres images (unauthenticated
# Docker Hub), once per leg.  That is exactly why the per-PR `paths:` list is
# narrow: a typical PR fires ONE of the four native OIDC legs, not four.
# On this leg it sits on top of a cold `dotnet restore` (~2-3min) as well.
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/dotnet/**'
      - 'test/e2e/auth-oidc-dotnet-e2e.test.ts'
      - 'test/e2e/fixtures/auth-oidc-e2e-dotnet.ddd'
      - 'package.json'
      - '.github/workflows/dotnet-oidc-e2e.yml'
  # Per-PR, path-scoped: fires on this gate's real blast radius (below), and
  # is binding because `pr-gate` fails on any non-passing check run present on
  # the head SHA.  The `run-oidc` label opt-in is gone -- a labeled trigger is
  # `false` on opened/synchronize and exempts the file from draft-gate
  # enforcement.  `ready_for_review` is what re-fires the leg when a draft
  # flips.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # DUPLICATED list, never a YAML anchor: the reader in
      # test/system/workflow-path-coverage.test.ts does not resolve
      # `&paths` / `*paths`, so an anchored list is silently outside that
      # gate.  Deliberately narrower than the `push:` block above -- that one
      # carries the whole generation path (language/macros/ir/system/util) as
      # the post-merge net, and the coverage test unions globs across
      # triggers, so this block only needs the per-PR blast radius.
      # The lowered, enriched IR every backend's auth emission reads.
      - 'src/ir/**'
      # The ASP.NET emission this test runs natively with `dotnet run`.
      - 'src/generator/dotnet/**'
      - 'src/platform/dotnet.ts'
      # The shared auth emitters both halves of the chain come from:
      # `_auth/dev-claims.ts` (the dev-realm claim shapes the seeded token
      # carries) and `_frontend/auth-ui.ts` (the login/callback surface the
      # handshake entry exercises).
      - 'src/generator/_auth/**'
      - 'src/generator/_frontend/auth-ui.ts'
      - 'test/e2e/auth-oidc-dotnet-e2e.test.ts'
      - 'test/e2e/fixtures/auth-oidc-e2e-dotnet.ddd'
      - '.github/workflows/dotnet-oidc-e2e.yml'
  workflow_dispatch:
  merge_group:
permissions:
  contents: read

concurrency:
  # Keyed on the PR number when there is one, so a superseded PR push cancels
  # its own in-flight Keycloak boot instead of leaking a runner slot; `push:
  # main` runs keep per-ref attribution and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet-oidc-e2e:
    runs-on: ubuntu-latest
    # Draft PRs run only the fast lane (test.yml, langium-generated,
    # workflow-lint, pr-gate); this leg fires once the PR is marked ready for
    # review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    # Pinned verbatim by test/system/draft-gate.test.ts.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Keycloak boot (~25s) + the generated project's `dotnet restore` (cold
    # ~2-3min) dominate.  15min cap.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Loom toolchain
        run: npm ci

      - name: Run .NET OIDC runtime e2e
        env:
          LOOM_AUTH_E2E_DOTNET: '1'
        run: npm run test:auth-e2e-dotnet -- --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo '## .NET OIDC runtime e2e failed' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'See the "Run .NET OIDC runtime e2e" step above for the captured backend stdout.' >> $GITHUB_STEP_SUMMARY
          echo 'The test boots a real Keycloak + postgres, gets a token for the seeded `demo` user, and asserts the generated .NET OIDC verifier validates it (JWKS) and maps the claims onto User.' >> $GITHUB_STEP_SUMMARY
