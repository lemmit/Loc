name: Python observability e2e

# Boots a generated FastAPI backend against a postgres sidecar and
# asserts the observability catalog envelope appears on stdout
# (server_starting → server_listening → request_start/health_ok/
# request_end with a shared request_id → server_shutdown →
# server_drained).  Mirrors `dotnet-obs-e2e.yml` / `java-obs-e2e.yml`.
#
# Push-to-main only (regression net, not a PR gate).

on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/python/**'
      - 'src/platform/python.ts'
      - '.github/workflows/python-obs-e2e.yml'
      - 'test/e2e/observability-events-python.test.ts'
  workflow_dispatch:
  merge_group:
  # On-demand per-PR run: apply the `run-obs` label to a PR to run this
  # otherwise push:main-only suite against that branch before merge.  The
  # job-level `if` below restricts the labeled trigger to that one label.
  pull_request:
    types: [labeled]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-obs-e2e:
    runs-on: ubuntu-latest
    # Skip the labeled trigger unless it's specifically `run-obs`; push,
    # merge-queue, and manual (`workflow_dispatch`) runs always proceed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-obs'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # uv provisions Python 3.12 itself; the cache keys on the pinned
      # dependency set so warm runs skip the resolver.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'src/generator/python/pins.ts'

      - name: Install Loom toolchain
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Boot generated backend + assert catalog envelope
        run: npm run test:obs-python
