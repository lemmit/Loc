name: Frontend full-stack e2e (nightly, no docker)

# Closes the frontend↔backend runtime hole the per-PR gates leave open.
#
# Per-PR, only React/Mantine ever drives a REAL backend (behavioral-ui-e2e.yml,
# PGlite-Hono); every OTHER frontend (Vue/Svelte/Angular/Feliz) gets a
# render-only smoke that TOLERATES the backend 404ing (generated-*-e2e.yml). So a
# generator change that breaks the wire contract between a non-React client and a
# real server compiles green, boots each half independently, and is invisible
# until — before this workflow — the nightly docker conformance leg.
#
# This nightly matrix drives each non-React frontend against the SAME in-process
# Hono-on-PGlite backend the per-PR React cell uses (run-ui.mjs, framework-
# agnostic): generate → build the frontend → boot backend + serve bundle on one
# origin → run the EMITTED Playwright `*.ui.spec.ts` page-object round-trips
# (create → submit → read back). No docker; the frontend build + Chromium
# dominate, which is why it's nightly rather than per-PR (the user's cost call).
#
# Each cell is a corpus case flagged `uiTier: "nightly"` (test/behavioral/
# corpus.json); run-ui.mjs builds each frontend via its own `npm run build` and
# auto-detects the built root (react/vue→dist, svelte→build, angular→dist/<app>/
# browser, feliz→dist). Vue + Svelte + Angular + Feliz are all verified locally
# (full round-trip green, all blocking). Feliz needs dotnet/Fable in the runner
# (the gated setup-dotnet step below).
#
# FLUTTER is the odd cell out and runs a DIFFERENT script, `run-ui-flutter.mjs`
# (matrix `runner:`), for two reasons the header above cannot paper over: it is
# built by the Flutter SDK rather than npm, and Flutter web renders to a CANVAS,
# so there is no DOM for the emitted testid-driven `*.ui.spec.ts` page objects to
# select — the flutter emitter ships none. That leg asserts the same round-trip
# over Flutter's ACCESSIBILITY TREE instead (seed over /api → deep-link the route
# → the app's own read must reach the real backend, decode, and render the seeded
# value). It is the only runtime tier flutter has: `generated-flutter-build.yml`
# is compile-only. Its cell is flagged `uiFlutter: true` in corpus.json.

on:
  schedule:
    - cron: '17 5 * * *'
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-fullstack:
    # Runs nightly, on manual dispatch, or on a PR carrying the
    # `frontend-fullstack` label (so it can be exercised on demand).
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'frontend-fullstack')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - frontend: vue
            case: sales-system-vue
            runner: run-ui.mjs
            experimental: false
          - frontend: svelte
            case: sales-system-svelte
            runner: run-ui.mjs
            experimental: false
          # Angular: BLOCKING. The Angular-codegen cascade this gate first
          # surfaced is fixed and the full round-trip (create product w/ a
          # value-object price → add a line → confirm → read back) is 10/10
          # green under Node 24. What landed: (1) containment-part response
          # fields typed precisely (`<Part>Response` instead of `unknown[]`);
          # (2) the containment `@for` tracks `$index` (was an undefined `idx`);
          # (3) FK/workflow/op form controls init `""` so the nonNullable
          # control types as `FormControl<string>` (was `FormControl(null)`);
          # (4) value-object fields render a nested `FormGroup` fieldset (was a
          # single flat input); (5) op REST paths are snake-cased (`add_line`,
          # matching the Hono route — was camelCase → 404).
          - frontend: angular
            case: sales-system-angular
            runner: run-ui.mjs
            experimental: false
          # Feliz (F#/Fable/Elmish): BLOCKING.  The frontend emits the full
          # `data-testid` surface, so the SHARED testid-driven page objects + smoke
          # spec + e2e config are wired in (feliz/index.ts); run-ui.mjs builds it
          # (`fable+vite→dist`) — needs dotnet (Fable is a dotnet tool), the gated
          # setup-dotnet step below.  Verified locally (Node 24 + .NET 8 + Fable
          # 4.29): the create product (value-object price) → create customer →
          # create order → addLine → confirm → read-back round-trip is 10/10 green.
          # The Feliz-codegen cascade a real build surfaced is fixed: aggregate-
          # qualified Page cases, HASH→PATH routing, create→detail redirect, `{ id }`
          # create decode, param-less op forms (`confirm()`), and the detail-field
          # testid on the value cell.
          - frontend: feliz
            case: sales-system-feliz
            runner: run-ui.mjs
            experimental: false
          # Flutter (Dart/Riverpod): BLOCKING.  The ONLY runtime tier flutter has
          # — its other gate (`generated-flutter-build.yml`) is compile-only, and
          # that blind spot is precisely how the non-parsing-Dart `FileRef??`
          # emitter defect survived into a shipped release.  Runs
          # `run-ui-flutter.mjs`, not run-ui.mjs (canvas rendering → no DOM page
          # objects; SDK build → no `npm run build`).  Needs the Flutter SDK (the
          # gated setup step below) and a full chromium (CanvasKit needs WebGL,
          # which `headless_shell` does not provide).  Verified locally against
          # Flutter 3.47.1: all three route round-trips green, and red on a
          # seeded `FileRef??` emitter mutation.
          - frontend: flutter
            case: sales-system-flutter
            runner: run-ui-flutter.mjs
            experimental: false
    # Non-blocking for cells not yet locally verified; flip by dropping the flag.
    continue-on-error: ${{ matrix.experimental || false }}
    name: ${{ matrix.frontend }} → real Hono backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      # Feliz builds via Fable, a dotnet tool (`dotnet tool restore && dotnet
      # fable`), so the Feliz cell needs the .NET SDK on PATH.  Gated so the
      # JSX-family cells don't pay for it.
      - name: Set up .NET (Feliz/Fable only)
        if: matrix.frontend == 'feliz'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      # The Flutter cell builds with the SDK (`flutter pub get` + `flutter build
      # web`), so it needs it on PATH — the same action `generated-flutter-build`
      # uses.  Gated so the npm-built cells don't pay for the SDK download.
      - name: Set up Flutter (flutter cell only)
        if: matrix.frontend == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Loom toolchain
        run: npm ci

      - name: Build toolchain
        run: npm run build

      - name: Install behavioral harness deps
        working-directory: test/behavioral
        run: npm ci || npm install --no-audit --no-fund

      - name: Run ${{ matrix.frontend }} full-stack UI round-trip
        working-directory: test/behavioral
        run: node ${{ matrix.runner }} ${{ matrix.case }}
