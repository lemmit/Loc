name: Cross-backend response differential (report-only)

# M-T9.11 slice (a) — the NON-BLOCKING runtime-value sensor.
#
# Boots the full five-backend compose stack (the same boot the nightly
# `conformance-full` parity job uses) and, with LOOM_DIFF_REPORT=1, has the
# parity e2e ALSO GET every backend's collection (findAll) endpoints, normalize
# the bodies, and diff them all-pairs — surfacing the runtime-value divergences
# the OpenAPI spec-diff is structurally blind to (enum casing, []-vs-null, a
# leaked/dropped field, decimal serialization).
#
# This job NEVER gates: the capture is wrapped so it only writes a report + a
# job summary, and the workflow is not a required check. Every bucket in the
# report is a candidate RS-rule.
#
# SCOPE, since slices (b)+(c) landed: this is now the DISCOVERY half only.
# ENFORCEMENT moved to the per-PR wire-golden gate — each backend diffs its own
# recorded responses against `test/behavioral/wire-golden/` inside the
# `behavioral-e2e*.yml` leg that already boots it (A ≡ golden ∧ B ≡ golden ⇒
# A ≡ B, so the five-way differential is five one-way gates at no new boot
# cost). What this nightly still adds is COVERAGE the behavioral corpus lacks:
# the wider compose stack — `showcase`, phoenix, and the auth-gated reads — over
# systems the per-PR legs do not boot. A divergence it surfaces here becomes an
# RS-rule and, where the behavioral corpus can reach it, a golden entry.

on:
  schedule:
    # 04:20 UTC nightly — after conformance-full (03:42) has usually finished,
    # so the two heavy compose boots don't contend for the runner.
    - cron: '20 4 * * *'
  workflow_dispatch:
  # Opt-in per-PR: apply the `run-differential` label to boot the stack and
  # produce the report for that branch.
  pull_request:
    types: [labeled]

concurrency:
  group: differential-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-differential'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      - name: Install Loom toolchain
        run: npm ci

      - name: Build toolchain
        run: npm run build

      - name: Boot stack + capture response differential (non-blocking)
        # continue-on-error: the whole POINT is a report, never a gate. A boot
        # flake or a backend that failed to come up must not turn this red.
        continue-on-error: true
        env:
          LOOM_E2E: '1'
          LOOM_DIFF_REPORT: '1'
        run: npx vitest run test/e2e/e2e.test.ts

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f /tmp/loom-differential-report.md ]; then
            cat /tmp/loom-differential-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No differential report produced — the stack likely failed to boot; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: response-differential-report
          path: /tmp/loom-differential-report.md
          if-no-files-found: warn
