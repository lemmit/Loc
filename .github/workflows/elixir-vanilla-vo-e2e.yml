name: Elixir / Vanilla VO wire round-trip (runtime e2e)

# Boots the generated vanilla Phoenix backend against a real postgres
# sidecar, POSTs a value-object-bearing aggregate, then GETs it back and
# asserts the VO subfields survive wire serialisation.
#
# The runtime regression gate for issue #1660 (fixed in #1664): a VO
# persists as an untyped jsonb `:map` and reloads STRING-keyed, but the
# emitted `serialize_<vo>/1` used to read subfields via struct-dot
# (`record.amount`), which `KeyError`s on a string-keyed map — so
# serialising ANY DB-loaded VO-bearing aggregate crashed (`GET /…/:id`
# → 500).  This shipped invisibly because NO other elixir boot fixture
# uses a value object, and `mix compile` is blind to the runtime crash.
#
# Reverting the #1664 fallback (`Map.get(record, :amount, Map.get(record,
# "amount"))` → `record.amount`) turns this job red.
#
# WHEN IT RUNS — per-PR, path-scoped (packet 1.4 of wave G1,
# `docs/new-plan/verification-waves-2026-09.md`).  A pull request that
# touches the vanilla elixir emitter tree, the elixir expression
# renderer, the shared IR, this leg's own test or this file gets a check
# run BEFORE merge; `pr-gate` then makes that run binding, because a
# check present on the head SHA is one it waits for.  `push: main` stays
# exactly as it was — the post-merge regression net over the wider
# generation path, and this leg's `ci-red-alarm` coverage.
#
# Why the PR paths are wider than `wire-serialize.ts`: the leg boots the
# WHOLE generated app (`generate system` → `mix deps.get`/compile →
# `ecto.migrate` → POST + GET), so any vanilla emitter — schema,
# migration, controller, repo, shell — can turn it red.  Watching only
# the serializer would be the "gate that never runs" shape.  It is still
# narrower than the push block: `src/{language,macros,system,util}/**`
# stay push-only, because a PR touching those already fires several
# heavier legs and the ~20-slot runner pool is the binding constraint.
#
# The `run-e2e` label no longer drives this workflow (it still drives
# `phoenix-ui-e2e` and `playground-e2e`); the label guard is replaced by
# the canonical draft gate, so drafts keep the fast lane and the run
# fires when the PR is marked ready for review.  Cold path is ~3-5min.
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/elixir/render-expr.ts'
      - 'src/generator/elixir/vanilla/wire-serialize.ts'
      - 'src/generator/elixir/vanilla/**'
      - 'src/platform/elixir.ts'
      - 'test/e2e/vo-roundtrip-elixir-vanilla.test.ts'
      - 'package.json'
      - '.github/workflows/elixir-vanilla-vo-e2e.yml'
  workflow_dispatch:
  # The per-PR block.  Deliberately written out in full rather than shared
  # with the push list via a YAML anchor: `workflow-path-coverage.test.ts`
  # reads `paths:` textually and does not follow `&anchor`/`*alias`, so an
  # aliased list would drop this file out of that gate silently.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/ir/**'
      - 'src/generator/elixir/render-expr.ts'
      - 'src/generator/elixir/vanilla/wire-serialize.ts'
      - 'src/generator/elixir/vanilla/**'
      - 'test/e2e/vo-roundtrip-elixir-vanilla.test.ts'
      - '.github/workflows/elixir-vanilla-vo-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs (a push to the branch obsoletes the previous
  # boot); never cancel a `push: main` run, whose value is per-commit
  # attribution for `ci-red-alarm`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vanilla-vo-e2e:
    runs-on: ubuntu-latest
    # The canonical draft gate: drafts get the fast lane, and the run
    # fires when the PR is marked ready for review.  Pinned verbatim by
    # test/system/draft-gate.test.ts.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Cold path: hex deps + plain Phoenix compile + postgres pull is
    # ~3-5min (plain Ecto dep set).  10min is comfortable.
    timeout-minutes: 10
    # Service container — pre-starts postgres on the host network with a
    # built-in healthcheck before any step runs.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # erlef/setup-beam — pinned so the dep set resolves deterministically.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Install Loom toolchain
        run: npm ci

      # Cache the hex dep tree + _build outputs across runs.  The key
      # tracks the vanilla shell-emit module that emits mix.exs so a dep
      # change mints a fresh entry, but unrelated emitter tweaks reuse
      # the warm cache.
      - name: Cache hex deps + _build
        uses: actions/cache@v5
        with:
          path: |
            ~/.hex
            ~/.mix
          key: hex-mix-vanilla-${{ hashFiles('src/generator/elixir/vanilla/shell-emit.ts') }}
          restore-keys: |
            hex-mix-vanilla-

      - name: Run vanilla VO wire round-trip e2e
        env:
          LOOM_VO_E2E_PHOENIX_VANILLA: '1'
          # The test reads LOOM_OBS_PG_URL and skips its in-test
          # `docker run postgres` step when the URL is supplied.
          LOOM_OBS_PG_URL: 'postgres://postgres:postgres@127.0.0.1:5432'
          LOOM_OBS_PG_DB: 'api'
        run: npx vitest run test/e2e/vo-roundtrip-elixir-vanilla.test.ts --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo '## Vanilla Phoenix VO wire round-trip failed' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'A 500 on `GET /api/invoices/:id` is the #1660 regression: a jsonb-loaded value object reloads string-keyed, and the wire serializer must read subfields key-type-agnostically (`Map.get(record, :amount, Map.get(record, "amount"))`), not via struct-dot.' >> $GITHUB_STEP_SUMMARY