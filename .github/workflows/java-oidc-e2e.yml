name: Java OIDC auth (runtime e2e)

# Runtime-verifies the OIDC turnkey-auth chain (D-AUTH-OIDC) on the Java
# backend, end-to-end: boots a REAL Keycloak (the bundled dev realm import)
# + postgres in docker, builds + runs the generated Spring Boot backend
# natively (`gradle bootJar` → `java -jar`), gets a real token for the seeded
# `demo` user via the password grant, and asserts the generated
# OidcUserVerifier validates it against Keycloak's live JWKS and maps the
# configured claims (incl. the dotted realm_access.roles path) onto User.
#
# The Java sibling of dotnet-oidc-e2e.yml / hono-oidc-e2e.yml — the runtime
# check the compile-only `gradle testClasses bootJar` gate can't give.
# ubuntu-latest ships docker + gradle; the backend runs natively, Keycloak +
# postgres are pulled images (no build).
#
# Triggers `push: main` + manual dispatch only — NOT per-PR (sibling to the
# *-obs-e2e jobs; same rationale: regression net, not a PR gate, and the
# Gradle build + Keycloak boot are heavier than a unit suite).
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/java/**'
      - 'src/platform/java.ts'
      - 'test/e2e/auth-oidc-java-e2e.test.ts'
      - 'test/e2e/fixtures/auth-oidc-e2e-java.ddd'
      - 'package.json'
      - '.github/workflows/java-oidc-e2e.yml'
  workflow_dispatch:
  merge_group:
  # On-demand per-PR run: apply the `run-oidc` label to a PR to run this
  # otherwise push:main-only suite against that branch before merge.  The
  # job-level `if` below restricts the labeled trigger to that one label.
  pull_request:
    types: [labeled]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  java-oidc-e2e:
    runs-on: ubuntu-latest
    # Skip the labeled trigger unless it's specifically `run-oidc`; push,
    # merge-queue, and manual (`workflow_dispatch`) runs always proceed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-oidc'
    # Keycloak boot (~25s) + the generated project's `gradle bootJar` (cold
    # ~2-3min) dominate.  20min cap.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # Java 25 toolchain needs Gradle 9.1+ (no wrapper is emitted).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/generator/java/emit/program.ts') }}
          restore-keys: |
            gradle-

      - name: Install Loom toolchain
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Run Java OIDC runtime e2e
        env:
          LOOM_AUTH_E2E_JAVA: '1'
        run: npm run test:auth-e2e-java -- --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo '## Java OIDC runtime e2e failed' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'See the "Run Java OIDC runtime e2e" step above for the captured backend stdout.' >> $GITHUB_STEP_SUMMARY
          echo 'The test boots a real Keycloak + postgres, gets a token for the seeded `demo` user, and asserts the generated Java OIDC verifier validates it (JWKS) and maps the claims onto User.' >> $GITHUB_STEP_SUMMARY
