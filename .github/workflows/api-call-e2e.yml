name: API call (typed in-system call runtime e2e)

# Runtime e2e for the typed in-system service-to-service call (M-T4.8):
# `resource r { kind: api, use: <SomeApi> }` bound to an api a SIBLING
# deployable `serves:`, called from domain code as `r.someOperation(...)`.
#
# Every other gate on this feature proves the generated code COMPILES —
# `tsc --noEmit` on the Hono client, `mypy --strict` + ruff on the Python one,
# the vitest-tier emitter pins. None of them prove it RUNS. That gap is not
# hypothetical: six defects in this feature were invisible to the vitest tier
# and visible only to a real compiler, and a compiler still cannot see a wrong
# URL, a path built from the router-relative fragment instead of the absolute
# one, or a response schema that parses but drops a field.
#
# So this workflow boots the real thing: two GENERATED backends as separate
# processes with SEPARATE DATABASES, and asserts the caller persists a value
# it could only have learned over HTTP from the callee. The assertion is
# deliberately indirect — `orderCode` on the caller's own row is copied out of
# the callee's response body, and the code was only ever POSTed to the callee,
# so a stubbed client, a 404-swallowing client, or a response schema that
# silently dropped `code` all fail it.
#
# It also exercises the `<RESOURCE>_URL` seam end to end: the suite injects
# `ORDERS_URL` exactly the way `src/system/index.ts` writes it into compose, so
# a drift between `resourceEnvUrlVar` and what the emitted client reads shows
# up here as a connection failure rather than as a silent localhost fallback.
#
# MATRIX — one leg per backend that ships a typed client, keyed on the CALLER
# (`shippingSvc`); the callee stays Hono throughout, because the point under
# test is the caller's generated client, not the callee's routes (those are
# already gated per-PR by the conformance/parity tier). All five legs are live.
#
# node and python boot natively; dotnet, java and elixir boot in the SAME
# container images their compile gates use. That is not a convenience — two
# defects were hiding behind the three container legs, both of which compiled
# clean: a Phoenix base URL read from a compile-time `@module_attribute` (a
# release would never see compose's address), and a PRE-EXISTING `MatchError` on
# every Phoenix workflow with a multi-word parameter.
#
# Triggers `push: main` + manual dispatch + an on-demand `run-api-call` label,
# NOT per-PR — the same docker-heavy-suite pattern as channels-e2e.yml /
# tenancy-e2e.yml (booting two backends on every PR is a runner burst for a
# regression that is acceptable to catch one merge later; the compile and
# emitter tiers already gate per-PR). Apply the label to run it pre-merge.
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/platform/hono/v4/adapters/api-client.ts'
      - 'src/generator/python/api-client.ts'
      - 'test/e2e/api-call-e2e.test.ts'
      - 'package.json'
      - '.github/workflows/api-call-e2e.yml'
  workflow_dispatch:
  # On-demand per-PR run: apply the `run-api-call` label to a PR to run this
  # otherwise push:main-only suite against that branch before merge.
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-call-e2e:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-api-call'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        caller: [node, python, dotnet, java, elixir]
    name: api-call-e2e (caller=${{ matrix.caller }})
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      - name: Set up uv (python)
        if: matrix.caller == 'python'
        uses: astral-sh/setup-uv@v7

      # The dotnet / java / elixir legs need no toolchain step: the suite boots
      # them inside their compile-gate images via docker, which ubuntu-latest
      # runners already have running.

      - name: Install Loom toolchain
        run: npm ci

      # Separate databases are load-bearing, not hygiene: if both deployables
      # shared one, the caller could read the callee's row locally and the
      # round-trip assertion would pass without any HTTP happening at all.
      - name: Create per-deployable databases
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres \
            -c "CREATE DATABASE orders_svc;" -c "CREATE DATABASE shipping_svc;"

      - name: Run typed in-system api call runtime e2e (caller=${{ matrix.caller }})
        env:
          LOOM_API_CALL_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          LOOM_API_CALL_CALLER: ${{ matrix.caller }}
          # hex.pm is unreachable from the Elixir container behind a
          # fingerprint-allowlisting proxy; a no-op on runners with direct
          # access (docs/tools.md).
          LOOM_HEX_MIRROR: ${{ matrix.caller == 'elixir' && '1' || '' }}
        run: npm run test:api-call -- --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo "## Typed in-system api call runtime e2e failed (caller=${{ matrix.caller }})" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Boots the generated callee (ordersSvc, Hono) and the generated caller (shippingSvc, ${{ matrix.caller }}) as separate processes against separate databases, and asserts the caller'"'"'s workflow reaches the callee over real HTTP through the `<RESOURCE>_URL` seam, validates the response at its boundary, and persists a field value its own database never saw. Also asserts a callee 404 surfaces as a FAILED call rather than a silently-persisted Shipment built from an absent body.' >> $GITHUB_STEP_SUMMARY
