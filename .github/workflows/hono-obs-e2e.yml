name: Hono observability events (runtime e2e)

# Boots the generated Hono backend, hits /health, then asserts the
# pino JSON-per-line stdout carries the catalog envelope:
#   server_starting → server_listening → request_start → request_end →
#   server_shutdown
#
# Lighter than the .NET / Phoenix sibling jobs — Hono runs in pure Node
# and the pg pool is lazy, so the suite needs no docker / no postgres
# sidecar.  Cost is dominated by the `npm install` of the generated
# project's deps (~60-90s with cache, ~3-4min cold).
#
# TIER: per-PR, path-scoped, binding through `pr-gate` — with `push: main`
# kept as the post-merge regression net.  Promoted out of push:main-only by
# wave G1 packet 1.1 of docs/new-plan/verification-waves-2026-09.md: a runtime
# gate that runs only after the merge can only ever report a red `main`, so
# whatever it catches, it catches too late.  The `run-obs` label opt-in is
# removed; the draft guard on the job below is what keeps draft PRs on the
# fast lane.
#
# The per-PR `paths:` block is deliberately NARROW — this gate's real blast
# radius is `src/ir/**`, `src/generator/typescript/**`, `src/platform/hono/**`,
# `src/generator/_obs/**` and its own e2e test file.  Narrowness IS the
# anti-abuse answer: five obs boots firing together on every PR would be the
# docker / runner burst anti-abuse heuristics watch for on public repos, so
# the paths are cut so a typical PR fires one or two of the five siblings,
# never all five.  Nothing outside that list reaches this subject per-PR; the
# broader generation path stays on the `push: main` block.
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/typescript/**'
      - 'src/platform/hono/**'
      - 'src/generator/_obs/**'
      - 'test/e2e/observability-events.test.ts'
      - 'package.json'
      - '.github/workflows/hono-obs-e2e.yml'
  workflow_dispatch:
  merge_group:
  # Per-PR, path-scoped: fires on this gate's real blast radius (below), and
  # is binding because `pr-gate` fails on any non-passing check run present on
  # the head SHA.  The `run-obs` label opt-in is gone -- a labeled trigger is
  # `false` on opened/synchronize and exempts the file from draft-gate
  # enforcement.  `ready_for_review` is what re-fires the leg when a draft
  # flips.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # DUPLICATED list, never a YAML anchor: the reader in
      # test/system/workflow-path-coverage.test.ts does not resolve
      # `&paths` / `*paths`, so an anchored list is silently outside that
      # gate.  Deliberately narrower than the `push:` block above -- that one
      # carries the whole generation path (language/macros/ir/system/util) as
      # the post-merge net, and the coverage test unions globs across
      # triggers, so this block only needs the per-PR blast radius.
      - 'src/ir/**'
      - 'src/generator/typescript/**'
      - 'src/platform/hono/**'
      - 'src/generator/_obs/**'
      - 'test/e2e/observability-events.test.ts'
      - '.github/workflows/hono-obs-e2e.yml'
permissions:
  contents: read

concurrency:
  # Keyed on the PR number when there is one so a superseded PR push cancels
  # its own in-flight boot; `push: main` runs keep per-ref attribution and are
  # never cancelled (cancel-in-progress is false off `pull_request`).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hono-obs-e2e:
    runs-on: ubuntu-latest
    # Draft PRs run only the fast lane (test.yml, langium-generated,
    # workflow-lint, pr-gate); this leg fires once the PR is marked ready for
    # review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    # Pinned verbatim by test/system/draft-gate.test.ts.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Cold path: ~3-4min (npm install of the generated project).
    # Warm path: ~60-90s.  8min cap.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Loom toolchain
        run: npm ci

      - name: Run Hono observability runtime e2e
        env:
          LOOM_OBS_E2E: '1'
        run: npx vitest run test/e2e/observability-events.test.ts --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo '## Hono runtime e2e failed' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'See the "Run Hono observability runtime e2e" step above for the captured server stdout.' >> $GITHUB_STEP_SUMMARY
          echo 'The test asserts the pino stream carries the catalog envelope (server_starting → server_listening → request_start → request_end → server_shutdown) with correlated request_id.' >> $GITHUB_STEP_SUMMARY
