name: Hono observability events (runtime e2e)

# Boots the generated Hono backend, hits /health, then asserts the
# pino JSON-per-line stdout carries the catalog envelope:
#   server_starting → server_listening → request_start → request_end →
#   server_shutdown
#
# Lighter than the .NET / Phoenix sibling jobs — Hono runs in pure Node
# and the pg pool is lazy, so the suite needs no docker / no postgres
# sidecar.  Cost is dominated by the `npm install` of the generated
# project's deps (~60-90s with cache, ~3-4min cold).
#
# Triggers `push: main` + manual dispatch only — NOT per-PR.  Sibling
# to dotnet-obs-e2e / elixir-vanilla-obs-e2e; same rationale (regression net,
# not a PR gate).  Three concurrent obs-e2e runs on every Hono / .NET /
# Phoenix-touching PR added up to a docker / runner burst exactly of
# the shape anti-abuse heuristics watch for on public repos.  Catching
# runtime regressions one merge later is acceptable.
on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/typescript/**'
      - 'src/platform/hono/**'
      - 'src/generator/_obs/**'
      - 'test/e2e/observability-events.test.ts'
      - 'package.json'
      - '.github/workflows/hono-obs-e2e.yml'
  workflow_dispatch:
  merge_group:
  # On-demand per-PR run: apply the `run-obs` label to a PR to run this
  # otherwise push:main-only suite against that branch before merge.  The
  # job-level `if` below restricts the labeled trigger to that one label.
  pull_request:
    types: [labeled]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hono-obs-e2e:
    runs-on: ubuntu-latest
    # Skip the labeled trigger unless it's specifically `run-obs`; push,
    # merge-queue, and manual (`workflow_dispatch`) runs always proceed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-obs'
    # Cold path: ~3-4min (npm install of the generated project).
    # Warm path: ~60-90s.  8min cap.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Pin npm 11
        # node 22 ships npm 10, which currently crashes in arborist's peer-set
        # walk (`Cannot read properties of null (reading 'edgesOut')`) while
        # resolving vitest's OPTIONAL peer `@vitest/browser-playwright`, whose
        # 5.0.0 was published 2026-09-03 against the `vitest@4` the stacks pin.
        # 38 test files `npm install` a generated node project, so this hits
        # most heavy gates.  Reproduced in a clean node:22-alpine container on
        # npm 10.9.8 with an empty cache, so it is not local state.
        #
        # Node 24 would ship npm 11 natively, but #2763 pinned CI back to 22
        # because node 24.20.0 breaks `langium generate` in npm ci's prepare
        # step (jsonschema@1.5.0 + the stricter URL parser).  So the npm bump
        # has to ride on node 22 rather than come along with a runtime bump.
        run: npm i -g npm@11

      - name: Install Loom toolchain
        run: npm ci

      - name: Run Hono observability runtime e2e
        env:
          LOOM_OBS_E2E: '1'
        run: npx vitest run test/e2e/observability-events.test.ts --reporter=verbose

      - name: Surface failure context
        if: failure()
        run: |
          echo '## Hono runtime e2e failed' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'See the "Run Hono observability runtime e2e" step above for the captured server stdout.' >> $GITHUB_STEP_SUMMARY
          echo 'The test asserts the pino stream carries the catalog envelope (server_starting → server_listening → request_start → request_end → server_shutdown) with correlated request_id.' >> $GITHUB_STEP_SUMMARY
