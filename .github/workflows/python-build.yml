name: Python build verification

# Statically gates a Python/FastAPI project generated from each
# test-fixture .ddd by `ddd generate system`: `uv sync` (the pinned dep
# set must resolve), `ruff check` + `ruff format --check` (emitted
# source must be lint- and format-clean — the Python analogue of the
# Biome gate on emitted TS), and `mypy --strict` (the same bar
# `/warnaserror` sets for .NET).  Catches emission bugs in the Python
# generator that the string-match unit tests cannot see.
#
# Mirrors `dotnet-build.yml`.  See docs/old/plans/python-backend-plan.md.

on:
  push:
    branches: [main]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/python/**'
      - 'src/generator/_expr/**'
      - 'src/platform/python.ts'
      - 'examples/**'
      - 'package.json'
      - '.github/workflows/python-build.yml'
      - 'test/e2e/generated-python-build.test.ts'
      - 'test/e2e/fixtures/python-build/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Every phase `generate system` walks, whatever the backend: parse ->
      # macro expand -> lower -> enrich -> IR validate -> compose, plus the
      # util/ leaves (naming, code-builder, platform-axes) every emitter
      # imports.  A change confined to one of these reaches this gate's
      # subject, so it has to be able to trigger it -- none of them could
      # before #2397.  Pinned by test/system/workflow-path-coverage.test.ts.
      - 'src/language/**'
      - 'src/macros/**'
      - 'src/ir/**'
      - 'src/system/**'
      - 'src/util/**'
      - 'src/generator/python/**'
      - 'src/generator/_expr/**'
      - 'src/platform/python.ts'
      - 'examples/**'
      - 'package.json'
      - '.github/workflows/python-build.yml'
      - 'test/e2e/generated-python-build.test.ts'
      - 'test/e2e/fixtures/python-build/**'
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-generated-python:
    # Draft PRs run only the fast lane (test.yml, langium-generated, workflow-lint,
    # pr-gate); this and the rest of the fan-out fire when the PR is marked ready
    # for review -- see docs/ci-gating.md, "Draft PRs and the runner queue".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # uv provisions Python 3.12 itself; the cache keys on the pinned
      # dep set (encoded in pins.ts) so warm runs skip the resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: 'src/generator/python/pins.ts'

      # Build the Loom toolchain.  `prepare` lifecycle runs
      # `langium:generate` which populates src/language/generated/.
      - name: Install Loom toolchain
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: uv sync + ruff + mypy --strict against each fixture
        run: npm run test:python
